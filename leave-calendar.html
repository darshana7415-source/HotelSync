<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leave Calendar - StaffSync</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="env.js"></script>
  <style>
    body { margin:0; background:#f6faf9; color:#102026; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    .shell { max-width:1120px; margin:0 auto; padding:16px; }
    .top { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:14px; }
    .top h1 { margin:0; font-size:24px; }
    .top a { color:#075f63; font-weight:800; text-decoration:none; }
    .card { background:#fff; border:1px solid #dbe8e5; border-radius:10px; padding:14px; box-shadow:0 8px 24px rgba(16,32,38,.06); margin-bottom:12px; }
    .months { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .month-btn { border:1px solid #cfe0dd; background:#eef8f6; color:#075f63; padding:10px 12px; border-radius:8px; font-weight:900; cursor:pointer; }
    .month-btn.active { background:#075f63; color:white; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid #dcebea; border-radius:8px; overflow:hidden; }
    .day-head, .day { border:1px solid #dcebea; padding:8px; min-height:72px; background:#fff; }
    .day-head { min-height:auto; background:#eef8f6; color:#075f63; font-weight:900; }
    .day-num { font-weight:900; margin-bottom:5px; }
    .outside { background:#f3f7f6; color:#99a; }
    .leave-pill { display:block; margin-top:4px; padding:4px 5px; border-radius:6px; font-size:11px; line-height:1.15; font-weight:800; }
    .approved { background:#dff5e8; color:#16733a; }
    .rejected { background:#ffe2e2; color:#9d1c1c; }
    .cancelled { background:#eee; color:#666; }
    .pending { background:#fff1cb; color:#8a6200; }
    .mini-empty { padding:16px; background:white; border:1px solid #dbe8e5; border-radius:8px; color:#667; }
    @media(max-width:720px) {
      .shell { padding:8px; }
      .top h1 { font-size:20px; }
      .top a { font-size:13px; white-space:nowrap; }
      .calendar { grid-template-columns:repeat(7,minmax(0,1fr)); }
      .day-head, .day { padding:4px 2px; min-height:58px; font-size:9px; overflow:hidden; }
      .leave-pill { font-size:7.5px; padding:2px; }
      .day-num { font-size:10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <h1>Leave Calendar</h1>
        <small>StaffSync Beach & Bliss Mirissa</small>
      </div>
      <a href="index.html#dashboard">Back to dashboard</a>
    </div>

    <section class="card">
      <strong>Month view</strong>
      <small id="access-note"></small>
      <div id="month-buttons" class="months"></div>
    </section>

    <section class="card">
      <h2 id="month-title">Loading...</h2>
      <div id="calendar" class="mini-empty">Loading leave calendar...</div>
    </section>
  </main>

<script>
(function () {
  const cfg = window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || {};
  const db = window.supabase?.createClient?.(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const calendar = document.querySelector("#calendar");
  const monthButtons = document.querySelector("#month-buttons");
  const monthTitle = document.querySelector("#month-title");
  const accessNote = document.querySelector("#access-note");

  if (!db) {
    calendar.textContent = "Supabase settings not loaded. Check env.js.";
    return;
  }

  const params = new URLSearchParams(location.search);
  const role = (params.get("role") || localStorage.getItem("staffsync.currentRole") || "").toLowerCase();
  const isStaff = role === "staff";

  function monthKey(date) {
    return date.toISOString().slice(0, 7);
  }

  function addMonths(date, count) {
    const d = new Date(date.getFullYear(), date.getMonth() + count, 1);
    return d;
  }

  function monthLabel(key) {
    return new Date(key + "-01T00:00:00").toLocaleDateString("en-US", { month:"long", year:"numeric" });
  }

  function leaveClass(status) {
    const s = String(status || "").toLowerCase();
    if (s.includes("reject")) return "rejected";
    if (s.includes("cancel")) return "cancelled";
    if (s.includes("approved") || s.includes("granted") || s === "approve") return "approved";
    return "pending";
  }

  function covers(row, key) {
    const start = String(row.start_date || "").slice(0, 10);
    const end = String(row.end_date || row.start_date || "").slice(0, 10);
    return start && key >= start && key <= end;
  }

  const today = new Date();
  const monthList = isStaff
    ? [monthKey(today), monthKey(addMonths(today, 1))]
    : [monthKey(addMonths(today, -1)), monthKey(today), monthKey(addMonths(today, 1))];

  let activeMonth = monthKey(today);
  let rows = [];

  accessNote.textContent = isStaff
    ? " Staff view shows current and next month."
    : " Admin/manager view shows previous, current, and next month.";

  function renderButtons() {
    monthButtons.innerHTML = monthList.map((key) =>
      `<button class="month-btn ${key === activeMonth ? "active" : ""}" data-month="${key}" type="button">${monthLabel(key)}</button>`
    ).join("");
  }

  function renderCalendar() {
    const first = new Date(activeMonth + "-01T00:00:00");
    const start = new Date(first);
    start.setDate(first.getDate() - first.getDay());

    monthTitle.textContent = monthLabel(activeMonth);

    const heads = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d) => `<div class="day-head">${d}</div>`).join("");
    let days = "";

    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = d.toISOString().slice(0, 10);
      const outside = key.slice(0, 7) !== activeMonth;
      const leaveItems = rows.filter((row) => covers(row, key));

      days += `
        <div class="day ${outside ? "outside" : ""}">
          <div class="day-num">${d.getDate()}</div>
          ${leaveItems.map((row) => `
            <span class="leave-pill ${leaveClass(row.status)}">
              ${row.employee_code} ${row.full_name}<br>${row.leave_type}
            </span>
          `).join("")}
        </div>
      `;
    }

    calendar.className = "calendar";
    calendar.innerHTML = heads + days;
  }

  async function loadRows() {
    const minMonth = monthList[0];
    const maxMonth = monthList[monthList.length - 1];
    const minDate = minMonth + "-01";
    const maxDateObj = new Date(maxMonth + "-01T00:00:00");
    maxDateObj.setMonth(maxDateObj.getMonth() + 1);
    maxDateObj.setDate(0);
    const maxDate = maxDateObj.toISOString().slice(0, 10);

    const result = await db
      .from("staff_leave_calendar_view")
      .select("*")
      .lte("start_date", maxDate)
      .gte("end_date", minDate)
      .order("employee_code", { ascending:true });

    if (result.error) {
      calendar.textContent = result.error.message;
      return;
    }

    rows = result.data || [];
    renderButtons();
    renderCalendar();
  }

  monthButtons.addEventListener("click", (event) => {
    const btn = event.target.closest("[data-month]");
    if (!btn) return;
    activeMonth = btn.dataset.month;
    renderButtons();
    renderCalendar();
  });

  loadRows();
})();
</script>
</body>
</html>
