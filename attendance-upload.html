<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attendance Reports - StaffSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=334">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="env.js"></script>
  <style>
    /* This page links style.css, so it inherits the design tokens. Everything below is
       layout specific to the report, expressed in those tokens rather than one-off colours. */
    body { margin:0; background:var(--canvas); color:var(--ink); }
    .shell { max-width:1120px; margin:0 auto; padding:var(--s5) var(--s5) var(--s7); }

    .top { display:flex; justify-content:space-between; gap:var(--s4); align-items:flex-end;
           flex-wrap:wrap; padding-bottom:var(--s4); margin-bottom:var(--s5);
           border-bottom:1px solid var(--line); }
    .top h1 { margin:0; font-size:1.5rem; }
    .top .sub { color:var(--muted); font-weight:500; font-size:0.875rem; margin-top:2px; }
    .back-link { color:var(--ink-2); font-weight:600; font-size:0.875rem; text-decoration:none;
                 display:inline-flex; align-items:center; gap:6px; padding:8px 12px;
                 border:1px solid var(--line-strong); border-radius:var(--r-md);
                 background:var(--surface); transition:background .14s ease, color .14s ease; }
    .back-link:hover { background:var(--surface-sunken); color:var(--ink); }
    .back-link svg { width:15px; height:15px; }

    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
            padding:var(--s5); margin-bottom:var(--s4); }

    /* Segmented control rather than loose pills -- reads as one switch, not two buttons. */
    .tabs { display:inline-flex; gap:2px; margin-bottom:var(--s4); padding:3px;
            background:var(--surface-sunken); border:1px solid var(--line); border-radius:var(--r-md); }
    .tab { border:0; background:transparent; color:var(--ink-2); border-radius:7px;
           padding:7px 16px; font-weight:600; cursor:pointer; font-size:0.875rem;
           transition:background .14s ease, color .14s ease; min-height:0; }
    .tab:hover { color:var(--ink); }
    .tab.active { background:var(--surface); color:var(--ink);
                  box-shadow:0 1px 2px rgba(16,27,34,.10); }

    .controls { display:flex; gap:var(--s3); align-items:end; flex-wrap:wrap; }
    label { display:grid; gap:6px; }

    /* Only one filled button per control row -- "Show day" is the action, PNG is a follow-up. */
    .btn-quiet { background:var(--surface); color:var(--ink-2); border:1px solid var(--line-strong);
                 font-weight:600; transition:background .14s ease, color .14s ease; }
    .btn-quiet:hover { background:var(--surface-sunken); color:var(--ink); }

    .note { color:var(--muted); font-size:0.8125rem; margin:var(--s3) 0 0; }

    .table-wrap { overflow-x:auto; margin-top:var(--s4); border:1px solid var(--line);
                  border-radius:var(--r-md); }
    table { width:100%; border-collapse:collapse; min-width:680px; }
    td.num, th.num { text-align:right; }

    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
               gap:var(--s3); margin-top:var(--s4); }
    .summary div { background:var(--surface-sunken); border:1px solid var(--line);
                   border-radius:var(--r-md); padding:var(--s3) var(--s4); }
    .summary b { display:block; font-size:1.5rem; font-family:var(--font-display);
                 font-weight:800; letter-spacing:-0.02em; }
    .summary small { color:var(--muted); font-weight:500; font-size:0.8125rem; }

    .msg { margin-top:var(--s4); padding:11px 14px; border-radius:var(--r-md);
           background:var(--brand-tint); color:var(--brand-ink); font-weight:600;
           font-size:0.875rem; border:1px solid rgba(14,95,101,.14); }
    .msg.error { background:var(--red-tint); color:var(--red); border-color:rgba(178,59,59,.18); }

    .tag { border-radius:999px; padding:3px 9px; font-size:0.75rem; font-weight:650;
           white-space:nowrap; display:inline-block; }
    .t-ok      { background:var(--green-tint); color:var(--green); }
    .t-open    { background:var(--amber-tint); color:var(--amber); }
    .t-working { background:var(--blue-tint);  color:var(--blue); }
    .t-none    { background:#eef1f3; color:#5f6c75; }

    .hidden { display:none !important; }

    .link-btn { background:none; border:0; color:var(--brand); font-weight:650; cursor:pointer;
                padding:5px 9px; font-size:0.8125rem; border-radius:var(--r-sm);
                min-height:0; transition:background .14s ease; }
    .link-btn:hover { background:var(--brand-tint); }

    .edit-backdrop { position:fixed; inset:0; background:rgba(16,27,34,.42);
                     backdrop-filter:blur(2px); display:grid; place-items:center;
                     padding:var(--s4); z-index:50; }
    .edit-box { background:var(--surface); border-radius:var(--r-lg); padding:var(--s5);
                width:min(440px,100%); box-shadow:var(--elev-modal); border:1px solid var(--line); }
    .edit-box h3 { margin:0 0 2px; font-size:1.0625rem; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); margin:var(--s4) 0 var(--s1); }
    .edit-actions { display:flex; gap:var(--s2); justify-content:flex-end; margin-top:var(--s5); }

    @media (max-width:720px) {
      .shell { padding:var(--s4) var(--s4) var(--s8); }
      .top { align-items:flex-start; }
      .top h1 { font-size:1.25rem; }
      .card { padding:var(--s4); border-radius:var(--r-md); }
      .controls label, .controls button { width:100%; }
      .summary { grid-template-columns:1fr 1fr; gap:var(--s2); }
      .summary div { padding:var(--s3); }
      .summary b { font-size:1.25rem; }
      .tabs { display:grid; grid-template-columns:1fr 1fr; width:100%; }
      .grid2 { grid-template-columns:1fr; }
      .edit-actions button { flex:1; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <h1>Attendance Reports</h1>
        <div class="sub">Recorded automatically from the fingerprint machine every day.</div>
      </div>
      <a class="back-link" href="index.html#dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Dashboard</a>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="daily" type="button">Daily</button>
      <button class="tab" data-tab="monthly" type="button" id="tab-monthly">Monthly</button>
    </div>

    <!-- DAILY -->
    <section class="card" id="panel-daily">
      <div class="controls">
        <label>
          Date
          <input id="daily-date" type="date">
        </label>
        <button class="primary" id="daily-load" type="button">Show day</button>
        <button id="daily-png" class="btn-quiet" type="button">Download PNG</button>
      </div>
      <div class="summary" id="daily-summary"></div>
      <div id="daily-msg" class="msg hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th><th>Name</th><th>In</th><th>Out</th>
              <th>Segments</th><th class="num">Hours</th><th>Status</th>
              <th id="daily-edit-head"></th>
            </tr>
          </thead>
          <tbody id="daily-body"></tbody>
        </table>
      </div>
    </section>

    <!-- MONTHLY -->
    <section class="card hidden" id="panel-monthly">
      <div class="controls">
        <label>
          Month
          <input id="monthly-month" type="month">
        </label>
        <button class="primary" id="monthly-load" type="button">Show month</button>
        <button id="monthly-png" class="btn-quiet" type="button">Download PNG</button>
      </div>
      <div class="summary" id="monthly-summary"></div>
      <div id="monthly-msg" class="msg hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th><th>Name</th>
              <th class="num">Days worked</th>
              <th class="num">Total hours</th>
              <th class="num">Average / day</th>
            </tr>
          </thead>
          <tbody id="monthly-body"></tbody>
        </table>
      </div>
      <p class="note" id="retention-note"></p>
    </section>
    <!-- Manual correction. Edits the real attendance record, not just the report, so the
         nightly re-import cannot silently undo the fix. -->
    <div id="edit-backdrop" class="edit-backdrop hidden">
      <div class="edit-box">
        <h3 id="edit-title">Correct attendance</h3>
        <p class="note" id="edit-sub"></p>
        <div class="grid2">
          <label>
            Check in
            <input id="edit-in" type="time" step="60">
          </label>
          <label>
            Check out
            <input id="edit-out" type="time" step="60">
          </label>
        </div>
        <p class="note">Leave check out empty if the person is still working. Times are hotel local time.</p>
        <div id="edit-msg" class="msg hidden"></div>
        <div class="edit-actions">
          <button id="edit-cancel" type="button">Cancel</button>
          <button id="edit-save" class="primary" type="button">Save correction</button>
        </div>
      </div>
    </div>
  </main>

<script>
(function () {
  const cfg = window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || {};
  const db = window.supabase?.createClient?.(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // Staff open this page with ?role=staff and only get the daily view of their own hotel's
  // records -- monthly totals stay a manager/admin view, as before.
  const isStaff = String(new URLSearchParams(location.search).get("role") || "").toLowerCase() === "staff";
  // Only admin/manager may correct records. Staff open this page read-only.
  const canEdit = !isStaff;

  const RETENTION_MONTHS = 3;

  // Kept from the last successful load so the PNG export can redraw the full table
  // (including rows scrolled out of view) without re-querying.
  let lastDaily = [];
  let lastDailyDate = "";
  let lastDailySummary = [];
  let lastMonthly = [];
  let lastMonthlyMonth = "";
  let lastMonthlySummary = [];

  const el = (id) => document.querySelector(id);
  const pad = (n) => String(n).padStart(2, "0");

  function todayKey() {
    const now = new Date();
    return now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  }

  function monthKey(dateKey) {
    return String(dateKey).slice(0, 7);
  }

  function monthBounds(month) {
    const [y, m] = String(month).split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    return { start: month + "-01", end: month + "-" + pad(last), days: last };
  }

  function hoursText(minutes) {
    const value = Math.max(0, Number(minutes) || 0);
    return Math.floor(value / 60) + ":" + pad(Math.round(value % 60));
  }

  function timeText(value) {
    return value ? String(value).slice(0, 5) : "";
  }

  function minutesFromClock(value) {
    const match = String(value || "").match(/^(\d{1,2}):(\d{2})/);
    if (!match) return null;
    return Number(match[1]) * 60 + Number(match[2]);
  }

  // Start time of the segment that is still open (the last one with no "out").
  function lastSegmentStart(row) {
    try {
      const list = Array.isArray(row.segments) ? row.segments : JSON.parse(row.segments || "[]");
      for (let i = list.length - 1; i >= 0; i -= 1) {
        if (!list[i].out) return list[i].in;
      }
    } catch {
      // fall through to the record's own clock_in
    }
    return timeText(row.clock_in);
  }

  function segmentsText(value) {
    try {
      const list = Array.isArray(value) ? value : JSON.parse(value || "[]");
      return list.map((s) => (s.in || "") + "-" + (s.out || "")).join(", ");
    } catch {
      return "";
    }
  }

  function showMsg(node, text, isError) {
    node.classList.remove("hidden");
    node.textContent = text;
    node.className = isError ? "msg error" : "msg";
  }

  function hideMsg(node) {
    node.classList.add("hidden");
  }

  function codeNumber(value) {
    const n = Number(String(value || "").replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  /* ---- PNG export -------------------------------------------------------------------
     Drawn straight onto a canvas rather than screenshotting the DOM: it needs no external
     library, always produces the full table (not just the part scrolled into view), and
     renders at 2x for a sharp image on phones and when printed.
     ----------------------------------------------------------------------------------- */

  const PNG = {
    scale: 2,
    padding: 28,
    rowHeight: 34,
    headerHeight: 38,
    titleBlock: 92,
    summaryHeight: 54,
    font: "Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
  };

  // columns: [{ label, key, width, align }]
  function downloadTablePng({ fileName, title, subtitle, columns, rows, summary }) {
    if (!rows.length) return false;

    const width = PNG.padding * 2 + columns.reduce((sum, c) => sum + c.width, 0);
    const height = PNG.padding * 2 + PNG.titleBlock +
      (summary && summary.length ? PNG.summaryHeight : 0) +
      PNG.headerHeight + rows.length * PNG.rowHeight + 26;

    const canvas = document.createElement("canvas");
    canvas.width = width * PNG.scale;
    canvas.height = height * PNG.scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(PNG.scale, PNG.scale);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);

    let y = PNG.padding;

    // Brand bar
    ctx.fillStyle = "#0d6b72";
    ctx.fillRect(0, 0, width, 6);

    // Title block
    ctx.fillStyle = "#16232e";
    ctx.font = "800 22px " + PNG.font;
    ctx.textBaseline = "top";
    ctx.fillText(title, PNG.padding, y + 8);

    ctx.fillStyle = "#64717f";
    ctx.font = "600 13px " + PNG.font;
    ctx.fillText(subtitle, PNG.padding, y + 38);
    ctx.fillText("StaffSync - Beach & Bliss Mirissa", PNG.padding, y + 58);

    y += PNG.titleBlock;

    // Summary strip
    if (summary && summary.length) {
      let x = PNG.padding;
      summary.forEach((item) => {
        const boxWidth = Math.min(190, (width - PNG.padding * 2) / summary.length);
        ctx.fillStyle = "#f7fafb";
        ctx.fillRect(x, y, boxWidth - 10, PNG.summaryHeight - 12);
        ctx.strokeStyle = "#ecf1f5";
        ctx.strokeRect(x, y, boxWidth - 10, PNG.summaryHeight - 12);
        ctx.fillStyle = "#16232e";
        ctx.font = "800 16px " + PNG.font;
        ctx.fillText(String(item.value), x + 10, y + 6);
        ctx.fillStyle = "#64717f";
        ctx.font = "600 11px " + PNG.font;
        ctx.fillText(String(item.label), x + 10, y + 26);
        x += boxWidth;
      });
      y += PNG.summaryHeight;
    }

    // Header row
    ctx.fillStyle = "#f7fafb";
    ctx.fillRect(PNG.padding, y, width - PNG.padding * 2, PNG.headerHeight);
    ctx.fillStyle = "#7a8794";
    ctx.font = "800 11px " + PNG.font;
    let hx = PNG.padding;
    columns.forEach((col) => {
      const text = String(col.label).toUpperCase();
      const tx = col.align === "right" ? hx + col.width - 10 - ctx.measureText(text).width : hx + 10;
      ctx.fillText(text, tx, y + 13);
      hx += col.width;
    });
    y += PNG.headerHeight;

    // Body rows
    rows.forEach((row, index) => {
      if (index % 2 === 1) {
        ctx.fillStyle = "#fbfdfe";
        ctx.fillRect(PNG.padding, y, width - PNG.padding * 2, PNG.rowHeight);
      }
      ctx.strokeStyle = "#eef3f6";
      ctx.beginPath();
      ctx.moveTo(PNG.padding, y + PNG.rowHeight);
      ctx.lineTo(width - PNG.padding, y + PNG.rowHeight);
      ctx.stroke();

      let cx = PNG.padding;
      columns.forEach((col) => {
        const raw = row[col.key];
        const text = raw === null || raw === undefined ? "" : String(raw);
        ctx.fillStyle = col.muted ? "#64717f" : "#16232e";
        ctx.font = (col.bold ? "700 " : "500 ") + "13px " + PNG.font;

        // Trim anything too wide for its column so text can never bleed into the next one.
        let shown = text;
        const maxWidth = col.width - 20;
        if (ctx.measureText(shown).width > maxWidth) {
          while (shown.length > 1 && ctx.measureText(shown + "...").width > maxWidth) {
            shown = shown.slice(0, -1);
          }
          shown += "...";
        }

        const tx = col.align === "right" ? cx + col.width - 10 - ctx.measureText(shown).width : cx + 10;
        ctx.fillText(shown, tx, y + 10);
        cx += col.width;
      });
      y += PNG.rowHeight;
    });

    // Footer
    ctx.fillStyle = "#94a3ad";
    ctx.font = "500 11px " + PNG.font;
    ctx.fillText("Generated " + new Date().toLocaleString("en-GB"), PNG.padding, y + 8);

    canvas.toBlob(function (blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");

    return true;
  }

  async function activeStaff() {
    const res = await db
      .from("staff_profiles")
      .select("id,employee_code,full_name")
      .order("employee_code", { ascending: true });
    if (res.error) throw res.error;
    return (res.data || [])
      .filter((p) => !String(p.employee_code || "").toLowerCase().includes("removed"))
      .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));
  }

  // ---- Daily ----

  async function loadDaily() {
    const date = el("#daily-date").value || todayKey();
    const body = el("#daily-body");
    const msg = el("#daily-msg");
    hideMsg(msg);
    body.innerHTML = "";
    el("#daily-summary").innerHTML = "";

    try {
      const [people, res] = await Promise.all([
        activeStaff(),
        db.from("attendance_imports").select("*").eq("attendance_date", date)
      ]);
      if (res.error) throw res.error;

      const byStaff = new Map();
      (res.data || []).forEach((row) => byStaff.set(row.staff_profile_id, row));

      // On the current day most people are still mid-shift. Showing them as "No check out"
      // with 0:00 hours makes a perfectly normal working day look like dozens of broken
      // records, so today is presented as work in progress: elapsed hours so far, and a
      // "Working now" status. Only a PAST day with no checkout is genuinely a missing scan.
      const isToday = date === todayKey();
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      let present = 0;
      let openShifts = 0;
      let totalMinutes = 0;

      lastDaily = people.map((person) => {
        const row = byStaff.get(person.id);
        if (!row) {
          return {
            code: person.employee_code, name: person.full_name,
            in: "", out: "", segments: "", hours: "0:00", status: "No scan"
          };
        }
        present += 1;
        const out = timeText(row.clock_out);
        let minutes = Number(row.total_minutes) || 0;

        if (!out) {
          openShifts += 1;
          // Count the still-running segment so "hours so far" is meaningful during the day.
          if (isToday) {
            const startedAt = minutesFromClock(lastSegmentStart(row));
            if (startedAt !== null && nowMinutes > startedAt) minutes += nowMinutes - startedAt;
          }
        }
        totalMinutes += minutes;

        return {
          code: person.employee_code, name: person.full_name,
          staffId: person.id,
          in: timeText(row.clock_in), out: out,
          segments: segmentsText(row.segments),
          hours: hoursText(minutes),
          status: out ? "Complete" : (isToday ? "Working now" : "No check out")
        };
      });
      // Keep the staff id on every row (including "No scan") so a correction can create a
      // record for someone the device never registered at all.
      lastDaily.forEach((r, i) => { if (!r.staffId) r.staffId = people[i].id; });
      lastDailyDate = date;

      const tagClass = {
        "Complete": "t-ok",
        "Working now": "t-working",
        "No check out": "t-open",
        "No scan": "t-none"
      };
      body.innerHTML = lastDaily.map((r, i) =>
        "<tr><td>" + r.code + "</td><td>" + r.name + "</td><td>" + r.in + "</td><td>" + r.out +
        "</td><td>" + r.segments + '</td><td class="num">' + r.hours +
        '</td><td><span class="tag ' + tagClass[r.status] + '">' + r.status + "</span></td>" +
        (canEdit
          ? '<td><button class="link-btn" data-edit="' + i + '" type="button">Correct</button></td>'
          : "<td></td>") +
        "</tr>"
      ).join("");

      lastDailySummary = [
        { value: present, label: "staff recorded" },
        { value: people.length - present, label: "no scan" },
        { value: openShifts, label: isToday ? "still working" : "missing check out" },
        { value: hoursText(totalMinutes), label: isToday ? "hours so far" : "total hours" }
      ];
      el("#daily-summary").innerHTML = lastDailySummary
        .map((s) => "<div><b>" + s.value + "</b><small>" + s.label + "</small></div>").join("");

      if (!res.data || !res.data.length) {
        showMsg(msg, "No attendance recorded for " + date + " yet. The day's records are saved automatically at midnight.", false);
      }
    } catch (error) {
      showMsg(msg, error.message || "Could not load daily attendance.", true);
    }
  }

  // ---- Monthly ----

  async function loadMonthly() {
    const month = el("#monthly-month").value || monthKey(todayKey());
    const bounds = monthBounds(month);
    const body = el("#monthly-body");
    const msg = el("#monthly-msg");
    hideMsg(msg);
    body.innerHTML = "";
    el("#monthly-summary").innerHTML = "";

    try {
      const [people, res] = await Promise.all([
        activeStaff(),
        db.from("attendance_imports").select("*")
          .gte("attendance_date", bounds.start)
          .lte("attendance_date", bounds.end)
      ]);
      if (res.error) throw res.error;

      const byStaff = new Map();
      (res.data || []).forEach((row) => {
        if (!byStaff.has(row.staff_profile_id)) byStaff.set(row.staff_profile_id, []);
        byStaff.get(row.staff_profile_id).push(row);
      });

      let grandMinutes = 0;
      let workedRows = 0;

      lastMonthly = people.map((person) => {
        const rows = byStaff.get(person.id) || [];
        const minutes = rows.reduce((sum, r) => sum + (Number(r.total_minutes) || 0), 0);
        const days = rows.length;
        grandMinutes += minutes;
        workedRows += days;
        return {
          code: person.employee_code, name: person.full_name,
          days: days, hours: hoursText(minutes),
          average: hoursText(days ? Math.round(minutes / days) : 0)
        };
      });
      lastMonthlyMonth = month;

      body.innerHTML = lastMonthly.map((r) =>
        "<tr><td>" + r.code + "</td><td>" + r.name +
        '</td><td class="num">' + r.days +
        '</td><td class="num">' + r.hours +
        '</td><td class="num">' + r.average + "</td></tr>"
      ).join("");

      lastMonthlySummary = [
        { value: people.length, label: "staff" },
        { value: workedRows, label: "days recorded" },
        { value: hoursText(grandMinutes), label: "total hours" }
      ];
      el("#monthly-summary").innerHTML = lastMonthlySummary
        .map((s) => "<div><b>" + s.value + "</b><small>" + s.label + "</small></div>").join("");

      if (!res.data || !res.data.length) {
        showMsg(msg, "No attendance recorded for " + month + ".", false);
      }
    } catch (error) {
      showMsg(msg, error.message || "Could not load monthly attendance.", true);
    }
  }

  /* ---- Manual correction ------------------------------------------------------------
     Corrections are written to attendance_records (the source of truth), never only to
     attendance_imports. The report is regenerated from attendance_records every night, so
     editing only the report would silently revert. After saving we rebuild that person's
     report row immediately so the change shows without waiting for the nightly job.
     ------------------------------------------------------------------------------------ */

  let editing = null; // { staffId, name, date }

  function openEdit(index) {
    const row = lastDaily[index];
    if (!row) return;
    editing = { staffId: row.staffId, name: row.name, date: lastDailyDate };

    el("#edit-title").textContent = "Correct attendance";
    el("#edit-sub").textContent = row.name + " - " + lastDailyDate;
    el("#edit-in").value = row.in || "";
    el("#edit-out").value = row.out || "";
    hideMsg(el("#edit-msg"));
    el("#edit-backdrop").classList.remove("hidden");
  }

  function closeEdit() {
    editing = null;
    el("#edit-backdrop").classList.add("hidden");
  }

  // Local wall-clock time on a given date -> an ISO instant, pinned to +05:30 so the value
  // never shifts with whatever timezone the admin's own device happens to be set to.
  function colomboIso(dateKey, timeHHMM) {
    return new Date(dateKey + "T" + timeHHMM + ":00+05:30").toISOString();
  }

  // Rebuild one person's row in attendance_imports from their real records for that date.
  async function rebuildImportRow(staffId, dateKey) {
    const startIso = colomboIso(dateKey, "00:00");
    const endIso = colomboIso(dateKey, "23:59");

    const res = await db.from("attendance_records")
      .select("clock_in_at, clock_out_at")
      .eq("staff_profile_id", staffId)
      .gte("clock_in_at", startIso)
      .lte("clock_in_at", endIso)
      .order("clock_in_at", { ascending: true });
    if (res.error) throw res.error;

    const rows = res.data || [];
    if (!rows.length) {
      await db.from("attendance_imports").delete()
        .eq("staff_profile_id", staffId)
        .eq("attendance_date", dateKey)
        .eq("source", "fingerprint_auto");
      return;
    }

    const fmt = (iso) => iso
      ? new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Colombo", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso))
      : "";
    const segments = rows.map((r) => ({ in: fmt(r.clock_in_at), out: fmt(r.clock_out_at) }));
    const totalMinutes = rows.reduce((sum, r) => r.clock_out_at
      ? sum + Math.max(0, Math.round((new Date(r.clock_out_at) - new Date(r.clock_in_at)) / 60000))
      : sum, 0);

    const staffRow = (await db.from("staff_profiles").select("full_name").eq("id", staffId).maybeSingle()).data;

    const up = await db.from("attendance_imports").upsert({
      hotel_id: "00000000-0000-0000-0000-000000000001",
      staff_profile_id: staffId,
      attendance_date: dateKey,
      source_name: staffRow?.full_name || "",
      clock_in: segments[0].in || null,
      clock_out: segments[segments.length - 1].out || null,
      segments,
      total_minutes: totalMinutes,
      source: "fingerprint_auto"
    }, { onConflict: "hotel_id,staff_profile_id,attendance_date,source" });
    if (up.error) throw up.error;
  }

  async function saveEdit() {
    if (!editing) return;
    const msg = el("#edit-msg");
    const inVal = el("#edit-in").value;
    const outVal = el("#edit-out").value;

    if (!inVal) return showMsg(msg, "Check in time is required.", true);
    if (outVal && outVal < inVal) {
      // Legitimate for a night shift, so allow it but make sure it is intentional.
      if (!confirm("Check out is earlier than check in. Save as an overnight shift ending the next day?")) return;
    }

    const btn = el("#edit-save");
    btn.disabled = true;
    btn.textContent = "Saving...";

    try {
      const startIso = colomboIso(editing.date, "00:00");
      const endIso = colomboIso(editing.date, "23:59");

      const existing = await db.from("attendance_records")
        .select("id, clock_in_at")
        .eq("staff_profile_id", editing.staffId)
        .gte("clock_in_at", startIso)
        .lte("clock_in_at", endIso)
        .order("clock_in_at", { ascending: true });
      if (existing.error) throw existing.error;

      const rows = existing.data || [];
      const clockIn = colomboIso(editing.date, inVal);
      // An out time before the in time means the shift finished after midnight.
      let clockOut = null;
      if (outVal) {
        const nextDay = outVal < inVal;
        const base = nextDay
          ? new Date(new Date(editing.date + "T00:00:00+05:30").getTime() + 86400000)
          : new Date(editing.date + "T00:00:00+05:30");
        const dayKey = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Colombo" }).format(base);
        clockOut = colomboIso(dayKey, outVal);
      }

      if (!rows.length) {
        const ins = await db.from("attendance_records").insert({
          staff_profile_id: editing.staffId,
          clock_in_at: clockIn,
          clock_out_at: clockOut,
          status: clockOut ? "completed" : "present"
        });
        if (ins.error) throw ins.error;
      } else {
        // Multiple segments: set the start of the first and the end of the last, leaving any
        // middle segments untouched.
        const first = rows[0];
        const last = rows[rows.length - 1];
        const u1 = await db.from("attendance_records").update({ clock_in_at: clockIn }).eq("id", first.id);
        if (u1.error) throw u1.error;
        const u2 = await db.from("attendance_records")
          .update({ clock_out_at: clockOut, status: clockOut ? "completed" : "present" })
          .eq("id", last.id);
        if (u2.error) throw u2.error;
      }

      await rebuildImportRow(editing.staffId, editing.date);
      closeEdit();
      await loadDaily();
    } catch (error) {
      showMsg(msg, (error.message || "Could not save.") +
        (String(error.message || "").match(/policy|permission/i)
          ? " You may need to sign in as admin in the main app first."
          : ""), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Save correction";
    }
  }

  el("#daily-body").addEventListener("click", (event) => {
    const btn = event.target.closest("[data-edit]");
    if (btn) openEdit(Number(btn.dataset.edit));
  });
  el("#edit-cancel").addEventListener("click", closeEdit);
  el("#edit-save").addEventListener("click", saveEdit);
  el("#edit-backdrop").addEventListener("click", (event) => {
    if (event.target === el("#edit-backdrop")) closeEdit();
  });

  // ---- Tabs ----

  function selectTab(name) {
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.classList.toggle("active", tab.dataset.tab === name);
    });
    el("#panel-daily").classList.toggle("hidden", name !== "daily");
    el("#panel-monthly").classList.toggle("hidden", name !== "monthly");
    if (name === "monthly") loadMonthly();
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => selectTab(tab.dataset.tab));
  });

  el("#daily-load").addEventListener("click", loadDaily);
  el("#daily-date").addEventListener("change", loadDaily);
  el("#monthly-load").addEventListener("click", loadMonthly);
  el("#monthly-month").addEventListener("change", loadMonthly);

  el("#daily-png").addEventListener("click", function () {
    const ok = downloadTablePng({
      fileName: "attendance-" + lastDailyDate + ".png",
      title: "Daily Attendance",
      subtitle: new Date(lastDailyDate + "T00:00:00").toLocaleDateString("en-GB", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      }),
      summary: lastDailySummary,
      columns: [
        { label: "Code", key: "code", width: 70 },
        { label: "Name", key: "name", width: 220, bold: true },
        { label: "In", key: "in", width: 80 },
        { label: "Out", key: "out", width: 80 },
        { label: "Segments", key: "segments", width: 200, muted: true },
        { label: "Hours", key: "hours", width: 90, align: "right" },
        { label: "Status", key: "status", width: 140, muted: true }
      ],
      rows: lastDaily
    });
    if (!ok) showMsg(el("#daily-msg"), "Nothing to download yet - load a day first.", true);
  });

  el("#monthly-png").addEventListener("click", function () {
    const ok = downloadTablePng({
      fileName: "attendance-" + lastMonthlyMonth + ".png",
      title: "Monthly Attendance",
      subtitle: new Date(lastMonthlyMonth + "-01T00:00:00").toLocaleDateString("en-GB", {
        month: "long", year: "numeric"
      }),
      summary: lastMonthlySummary,
      columns: [
        { label: "Code", key: "code", width: 70 },
        { label: "Name", key: "name", width: 260, bold: true },
        { label: "Days worked", key: "days", width: 130, align: "right" },
        { label: "Total hours", key: "hours", width: 130, align: "right" },
        { label: "Average / day", key: "average", width: 140, align: "right" }
      ],
      rows: lastMonthly
    });
    if (!ok) showMsg(el("#monthly-msg"), "Nothing to download yet - load a month first.", true);
  });

  // ---- Init ----

  if (!db) {
    showMsg(el("#daily-msg"), "Supabase settings not loaded. Check env.js.", true);
    return;
  }

  if (isStaff) {
    el("#tab-monthly").classList.add("hidden");
  }
  if (canEdit) {
    el("#daily-edit-head").textContent = "Fix";
  }

  el("#retention-note").textContent =
    "Attendance records are kept for the last " + RETENTION_MONTHS +
    " months. Older months are removed automatically.";

  el("#daily-date").value = todayKey();
  el("#monthly-month").value = monthKey(todayKey());
  loadDaily();
})();
</script>
</body>
</html>
