<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attendance Upload Preview - StaffSync</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f4fbfb;margin:0;color:#10202a}
    .wrap{max-width:1200px;margin:auto;padding:14px}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
    h1{margin:0;font-size:28px}
    a,.btn{background:#006b6b;color:white;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:800;border:0;cursor:pointer}
    .card{background:white;border:1px solid #d8e8e8;border-radius:10px;padding:14px;margin-top:14px}
    input{padding:10px;border:1px solid #d8e8e8;border-radius:8px;width:100%;box-sizing:border-box}
    table{width:100%;border-collapse:collapse;margin-top:12px;background:white}
    th,td{border:1px solid #d8e8e8;padding:7px;text-align:left;font-size:12px}
    th{background:#eaf7f7;color:#006b6b}
    .ok{background:#dff7e8;color:#116b35;font-weight:800}
    .warn{background:#fff4d6;color:#8a5b00;font-weight:800}
    .bad{background:#ffe1e1;color:#9a1b1b;font-weight:800}
    .muted{color:#667085}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
    .summary div{background:#eaf7f7;padding:10px;border-radius:8px}
    @media(max-width:720px){
      h1{font-size:20px}.summary{grid-template-columns:1fr 1fr}
      table{font-size:11px;display:block;overflow:auto}
      th,td{font-size:10px;padding:5px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Attendance Upload Preview</h1>
      <div class="muted">Hikvision fingerprint Excel preview only. Nothing is saved yet.</div>
    </div>
    <a href="index.html#dashboard">Back to dashboard</a>
  </div>

  <div class="card">
    <h2>Upload Hikvision Excel</h2>
    <input id="file" type="file" accept=".xlsx,.xls,.csv">
    <div id="status" class="muted" style="margin-top:10px">Choose the daily attendance sheet.</div>
    <div class="summary" id="summary"></div>
    <div id="warnings"></div>
    <table id="table" hidden>
      <thead>
        <tr>
          <th>Date</th>
          <th>Sheet name</th>
          <th>Matched staff</th>
          <th>Clock in</th>
          <th>Clock out</th>
          <th>Segments</th>
          <th>Total hours</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<script>
const aliases = {
  "dulip": "Duleep De Silva",
  "duleep": "Duleep De Silva",
  "priyantha": "Proyantha SH",
  "proyantha": "Proyantha SH"
};

const knownStaff = [
  "DIleesha De SIlva","Thusitha Paranamana","Duleep De Silva","Proyantha SH","Ajith",
  "Dineth","Ayesha","Supun","Ruwan Kumarasiri","Gayan","Kavindu Lakshan","Ganindu Sathruwan",
  "Muditha Weerarathne","Pathum","Naveen","Sineth","Navod","Kaveesha","Maleesha","Shiromi",
  "Nuwan","Isuri","Nipuni","Sujith","Chathura","Thanuj"
];

function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function cleanName(v){return String(v||"").replace(/\s+/g," ").trim();}
function matchStaff(name){
  const n=cleanName(name);
  const alias=aliases[norm(n)] || aliases[String(n).toLowerCase()];
  if(alias) return alias;
  const exact=knownStaff.find(s=>norm(s)===norm(n));
  if(exact) return exact;
  const loose=knownStaff.find(s=>norm(s).includes(norm(n)) || norm(n).includes(norm(s)));
  return loose || "";
}
function badValue(v){
  const s=String(v||"").toLowerCase().trim();
  return !s || s==="off" || s==="starting date" || s==="unmarked" || s.includes("#value");
}
function excelDateToYmd(v){
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  const s=String(v||"").trim();
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    const y=m[3].length===2 ? "20"+m[3] : m[3];
    return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  }
  return "";
}
function timeText(v){
  if(badValue(v)) return "";
  if(v instanceof Date) return `${String(v.getHours()).padStart(2,"0")}:${String(v.getMinutes()).padStart(2,"0")}`;
  if(typeof v==="number"){
    const total=Math.round(v*24*60);
    const hh=Math.floor(total/60)%24;
    const mm=total%60;
    return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  }
  const s=String(v||"").trim().replace(/\s+/g,"");
  const m=s.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return "";
  return `${String(m[1]).padStart(2,"0")}:${m[2]}`;
}
function minutes(t){const p=t.split(":").map(Number);return p[0]*60+p[1];}
function duration(start,end){
  if(!start||!end)return 0;
  let a=minutes(start), b=minutes(end);
  if(b<a)b+=1440;
  return b-a;
}
function hours(mins){return Math.round((mins/60)*100)/100;}
function parseSheet(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  let date="";
  for(const row of rows.slice(0,5)){
    for(const cell of row){
      const d=excelDateToYmd(cell);
      if(d){date=d;break;}
    }
    if(date)break;
  }
  const out=[];
  rows.forEach((row,idx)=>{
    const name=cleanName(row[1]);
    if(!name || ["in","out","shift1","total"].includes(name.toLowerCase())) return;
    const firstCell=String(row[2]||row[1]||"").toLowerCase();
    if(idx<2 || firstCell.includes("in")) return;

    const pairs=[[row[2],row[3]],[row[4],row[5]],[row[6],row[7]]]
      .map(p=>[timeText(p[0]),timeText(p[1])])
      .filter(p=>p[0]||p[1]);

    const valid=pairs.filter(p=>p[0]&&p[1]);
    const total=valid.reduce((sum,p)=>sum+duration(p[0],p[1]),0);
    const matched=matchStaff(name);
    let status="OK";
    if(String(row[2]||"").toLowerCase().includes("off")) status="OFF";
    else if(!matched) status="UNMATCHED";
    else if(!valid.length) status="NO VALID PUNCH";
    else if(valid.length!==pairs.length) status="MISSING IN/OUT";

    out.push({
      date,name,matched,
      clockIn: valid[0]?.[0] || "",
      clockOut: valid[valid.length-1]?.[1] || "",
      segments: valid.map(p=>p[0]+"-"+p[1]).join(", "),
      hours: hours(total),
      status
    });
  });
  return out;
}
function render(records){
  const body=document.querySelector("#body");
  body.innerHTML=records.map(r=>`
    <tr>
      <td>${r.date}</td>
      <td>${r.name}</td>
      <td>${r.matched || "-"}</td>
      <td>${r.clockIn}</td>
      <td>${r.clockOut}</td>
      <td>${r.segments}</td>
      <td>${r.hours}</td>
      <td class="${r.status==="OK"?"ok":(r.status==="UNMATCHED"||r.status==="NO VALID PUNCH"?"bad":"warn")}">${r.status}</td>
    </tr>
  `).join("");
  document.querySelector("#table").hidden=false;

  const ok=records.filter(r=>r.status==="OK").length;
  const unmatched=records.filter(r=>r.status==="UNMATCHED").length;
  const warnings=records.filter(r=>r.status!=="OK"&&r.status!=="UNMATCHED").length;
  const totalHours=hours(records.reduce((s,r)=>s+(Number(r.hours)||0),0));
  document.querySelector("#summary").innerHTML=`
    <div><b>${records.length}</b><br>Total rows</div>
    <div><b>${ok}</b><br>Ready records</div>
    <div><b>${unmatched}</b><br>Unmatched names</div>
    <div><b>${totalHours}</b><br>Total hours</div>
  `;
  document.querySelector("#status").textContent=`Preview loaded. ${warnings} warning rows found.`;
}
document.querySelector("#file").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:"array",cellDates:true});
  let all=[];
  wb.SheetNames.forEach(name=>{all=all.concat(parseSheet(wb.Sheets[name]));});
  render(all);
});
</script>
</body>
</html>
