<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attendance Reports - StaffSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="env.js"></script>
  <style>
    body { margin:0; background:#eef2f5; color:#16232e;
           font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .shell { max-width:1100px; margin:0 auto; padding:20px 18px 40px; }
    .top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; }
    .top h1 { margin:0 0 2px; font-size:26px; letter-spacing:-0.02em;
              font-family:"Plus Jakarta Sans",Inter,sans-serif; }
    .top .sub { color:#64717f; font-weight:600; }
    .top a { color:#0d6b72; font-weight:800; text-decoration:none; }
    .card { background:#fff; border:1px solid rgba(20,45,58,.08); border-radius:16px; padding:18px;
            box-shadow:0 1px 2px rgba(18,36,46,.06), 0 10px 28px rgba(18,36,46,.08); margin-bottom:18px; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab { border:1px solid #dfe8ee; background:#fff; color:#16232e; border-radius:999px;
           padding:9px 18px; font-weight:800; cursor:pointer; font-size:14px; }
    .tab.active { background:#0d6b72; border-color:#0d6b72; color:#fff; }
    .controls { display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin-bottom:4px; }
    label { display:grid; gap:6px; font-weight:700; font-size:14px; }
    input,select,button { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid #dfe8ee; }
    input,select { background:#fff; color:#16232e; }
    button.primary { background:#0d6b72; color:#fff; border:0; font-weight:800; cursor:pointer; }
    .note { color:#64717f; font-weight:600; margin:12px 0 0; }
    .table-wrap { overflow-x:auto; margin-top:14px; }
    table { width:100%; border-collapse:collapse; min-width:640px; font-size:14px; }
    th,td { padding:10px 9px; text-align:left; border-bottom:1px solid #ecf1f5; }
    th { background:#f7fafb; color:#7a8794; font-size:11px; text-transform:uppercase;
         letter-spacing:.07em; font-weight:800; }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    tbody tr:hover { background:#f6fafb; }
    .tag { border-radius:999px; padding:4px 10px; font-size:12px; font-weight:800; white-space:nowrap; display:inline-block; }
    .t-ok { background:#e4f6ed; color:#12734b; }
    .t-open { background:#fff3df; color:#8a5b00; }
    .t-none { background:#eef0f3; color:#5f6874; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px; }
    .summary div { background:#f7fafb; border:1px solid #ecf1f5; border-radius:12px; padding:12px 14px; }
    .summary b { display:block; font-size:22px; font-variant-numeric:tabular-nums;
                 font-family:"Plus Jakarta Sans",Inter,sans-serif; }
    .summary small { color:#64717f; font-weight:600; }
    .msg { margin-top:14px; padding:12px; border-radius:10px; background:#eaf7f2; color:#075f63; font-weight:700; }
    .msg.error { background:#fff0f0; color:#9d1c1c; }
    .hidden { display:none !important; }
    @media (max-width:700px) {
      .shell { padding:14px 12px 32px; }
      .top h1 { font-size:20px; }
      .card { padding:14px; border-radius:14px; }
      input,select,button { min-height:44px; font-size:16px; }
      .controls label, .controls button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <h1>Attendance Reports</h1>
        <div class="sub">Recorded automatically from the fingerprint machine every day.</div>
      </div>
      <a href="index.html#dashboard">Back to dashboard</a>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="daily" type="button">Daily</button>
      <button class="tab" data-tab="monthly" type="button" id="tab-monthly">Monthly</button>
    </div>

    <!-- DAILY -->
    <section class="card" id="panel-daily">
      <div class="controls">
        <label>
          Date
          <input id="daily-date" type="date">
        </label>
        <button class="primary" id="daily-load" type="button">Show day</button>
        <button id="daily-png" type="button">Download PNG</button>
      </div>
      <div class="summary" id="daily-summary"></div>
      <div id="daily-msg" class="msg hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th><th>Name</th><th>In</th><th>Out</th>
              <th>Segments</th><th class="num">Hours</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="daily-body"></tbody>
        </table>
      </div>
    </section>

    <!-- MONTHLY -->
    <section class="card hidden" id="panel-monthly">
      <div class="controls">
        <label>
          Month
          <input id="monthly-month" type="month">
        </label>
        <button class="primary" id="monthly-load" type="button">Show month</button>
        <button id="monthly-png" type="button">Download PNG</button>
      </div>
      <div class="summary" id="monthly-summary"></div>
      <div id="monthly-msg" class="msg hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th><th>Name</th>
              <th class="num">Days worked</th>
              <th class="num">Total hours</th>
              <th class="num">Average / day</th>
            </tr>
          </thead>
          <tbody id="monthly-body"></tbody>
        </table>
      </div>
      <p class="note" id="retention-note"></p>
    </section>
  </main>

<script>
(function () {
  const cfg = window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || {};
  const db = window.supabase?.createClient?.(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // Staff open this page with ?role=staff and only get the daily view of their own hotel's
  // records -- monthly totals stay a manager/admin view, as before.
  const isStaff = String(new URLSearchParams(location.search).get("role") || "").toLowerCase() === "staff";

  const RETENTION_MONTHS = 3;

  // Kept from the last successful load so the PNG export can redraw the full table
  // (including rows scrolled out of view) without re-querying.
  let lastDaily = [];
  let lastDailyDate = "";
  let lastDailySummary = [];
  let lastMonthly = [];
  let lastMonthlyMonth = "";
  let lastMonthlySummary = [];

  const el = (id) => document.querySelector(id);
  const pad = (n) => String(n).padStart(2, "0");

  function todayKey() {
    const now = new Date();
    return now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  }

  function monthKey(dateKey) {
    return String(dateKey).slice(0, 7);
  }

  function monthBounds(month) {
    const [y, m] = String(month).split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    return { start: month + "-01", end: month + "-" + pad(last), days: last };
  }

  function hoursText(minutes) {
    const value = Math.max(0, Number(minutes) || 0);
    return Math.floor(value / 60) + ":" + pad(Math.round(value % 60));
  }

  function timeText(value) {
    return value ? String(value).slice(0, 5) : "";
  }

  function segmentsText(value) {
    try {
      const list = Array.isArray(value) ? value : JSON.parse(value || "[]");
      return list.map((s) => (s.in || "") + "-" + (s.out || "")).join(", ");
    } catch {
      return "";
    }
  }

  function showMsg(node, text, isError) {
    node.classList.remove("hidden");
    node.textContent = text;
    node.className = isError ? "msg error" : "msg";
  }

  function hideMsg(node) {
    node.classList.add("hidden");
  }

  function codeNumber(value) {
    const n = Number(String(value || "").replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  /* ---- PNG export -------------------------------------------------------------------
     Drawn straight onto a canvas rather than screenshotting the DOM: it needs no external
     library, always produces the full table (not just the part scrolled into view), and
     renders at 2x for a sharp image on phones and when printed.
     ----------------------------------------------------------------------------------- */

  const PNG = {
    scale: 2,
    padding: 28,
    rowHeight: 34,
    headerHeight: 38,
    titleBlock: 92,
    summaryHeight: 54,
    font: "Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
  };

  // columns: [{ label, key, width, align }]
  function downloadTablePng({ fileName, title, subtitle, columns, rows, summary }) {
    if (!rows.length) return false;

    const width = PNG.padding * 2 + columns.reduce((sum, c) => sum + c.width, 0);
    const height = PNG.padding * 2 + PNG.titleBlock +
      (summary && summary.length ? PNG.summaryHeight : 0) +
      PNG.headerHeight + rows.length * PNG.rowHeight + 26;

    const canvas = document.createElement("canvas");
    canvas.width = width * PNG.scale;
    canvas.height = height * PNG.scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(PNG.scale, PNG.scale);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);

    let y = PNG.padding;

    // Brand bar
    ctx.fillStyle = "#0d6b72";
    ctx.fillRect(0, 0, width, 6);

    // Title block
    ctx.fillStyle = "#16232e";
    ctx.font = "800 22px " + PNG.font;
    ctx.textBaseline = "top";
    ctx.fillText(title, PNG.padding, y + 8);

    ctx.fillStyle = "#64717f";
    ctx.font = "600 13px " + PNG.font;
    ctx.fillText(subtitle, PNG.padding, y + 38);
    ctx.fillText("StaffSync - Beach & Bliss Mirissa", PNG.padding, y + 58);

    y += PNG.titleBlock;

    // Summary strip
    if (summary && summary.length) {
      let x = PNG.padding;
      summary.forEach((item) => {
        const boxWidth = Math.min(190, (width - PNG.padding * 2) / summary.length);
        ctx.fillStyle = "#f7fafb";
        ctx.fillRect(x, y, boxWidth - 10, PNG.summaryHeight - 12);
        ctx.strokeStyle = "#ecf1f5";
        ctx.strokeRect(x, y, boxWidth - 10, PNG.summaryHeight - 12);
        ctx.fillStyle = "#16232e";
        ctx.font = "800 16px " + PNG.font;
        ctx.fillText(String(item.value), x + 10, y + 6);
        ctx.fillStyle = "#64717f";
        ctx.font = "600 11px " + PNG.font;
        ctx.fillText(String(item.label), x + 10, y + 26);
        x += boxWidth;
      });
      y += PNG.summaryHeight;
    }

    // Header row
    ctx.fillStyle = "#f7fafb";
    ctx.fillRect(PNG.padding, y, width - PNG.padding * 2, PNG.headerHeight);
    ctx.fillStyle = "#7a8794";
    ctx.font = "800 11px " + PNG.font;
    let hx = PNG.padding;
    columns.forEach((col) => {
      const text = String(col.label).toUpperCase();
      const tx = col.align === "right" ? hx + col.width - 10 - ctx.measureText(text).width : hx + 10;
      ctx.fillText(text, tx, y + 13);
      hx += col.width;
    });
    y += PNG.headerHeight;

    // Body rows
    rows.forEach((row, index) => {
      if (index % 2 === 1) {
        ctx.fillStyle = "#fbfdfe";
        ctx.fillRect(PNG.padding, y, width - PNG.padding * 2, PNG.rowHeight);
      }
      ctx.strokeStyle = "#eef3f6";
      ctx.beginPath();
      ctx.moveTo(PNG.padding, y + PNG.rowHeight);
      ctx.lineTo(width - PNG.padding, y + PNG.rowHeight);
      ctx.stroke();

      let cx = PNG.padding;
      columns.forEach((col) => {
        const raw = row[col.key];
        const text = raw === null || raw === undefined ? "" : String(raw);
        ctx.fillStyle = col.muted ? "#64717f" : "#16232e";
        ctx.font = (col.bold ? "700 " : "500 ") + "13px " + PNG.font;

        // Trim anything too wide for its column so text can never bleed into the next one.
        let shown = text;
        const maxWidth = col.width - 20;
        if (ctx.measureText(shown).width > maxWidth) {
          while (shown.length > 1 && ctx.measureText(shown + "...").width > maxWidth) {
            shown = shown.slice(0, -1);
          }
          shown += "...";
        }

        const tx = col.align === "right" ? cx + col.width - 10 - ctx.measureText(shown).width : cx + 10;
        ctx.fillText(shown, tx, y + 10);
        cx += col.width;
      });
      y += PNG.rowHeight;
    });

    // Footer
    ctx.fillStyle = "#94a3ad";
    ctx.font = "500 11px " + PNG.font;
    ctx.fillText("Generated " + new Date().toLocaleString("en-GB"), PNG.padding, y + 8);

    canvas.toBlob(function (blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");

    return true;
  }

  async function activeStaff() {
    const res = await db
      .from("staff_profiles")
      .select("id,employee_code,full_name")
      .order("employee_code", { ascending: true });
    if (res.error) throw res.error;
    return (res.data || [])
      .filter((p) => !String(p.employee_code || "").toLowerCase().includes("removed"))
      .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));
  }

  // ---- Daily ----

  async function loadDaily() {
    const date = el("#daily-date").value || todayKey();
    const body = el("#daily-body");
    const msg = el("#daily-msg");
    hideMsg(msg);
    body.innerHTML = "";
    el("#daily-summary").innerHTML = "";

    try {
      const [people, res] = await Promise.all([
        activeStaff(),
        db.from("attendance_imports").select("*").eq("attendance_date", date)
      ]);
      if (res.error) throw res.error;

      const byStaff = new Map();
      (res.data || []).forEach((row) => byStaff.set(row.staff_profile_id, row));

      let present = 0;
      let openShifts = 0;
      let totalMinutes = 0;

      lastDaily = people.map((person) => {
        const row = byStaff.get(person.id);
        if (!row) {
          return {
            code: person.employee_code, name: person.full_name,
            in: "", out: "", segments: "", hours: "0:00", status: "No scan"
          };
        }
        present += 1;
        totalMinutes += Number(row.total_minutes) || 0;
        const out = timeText(row.clock_out);
        if (!out) openShifts += 1;
        return {
          code: person.employee_code, name: person.full_name,
          in: timeText(row.clock_in), out: out,
          segments: segmentsText(row.segments),
          hours: hoursText(row.total_minutes),
          status: out ? "Complete" : "No check out"
        };
      });
      lastDailyDate = date;

      const tagClass = { "Complete": "t-ok", "No check out": "t-open", "No scan": "t-none" };
      body.innerHTML = lastDaily.map((r) =>
        "<tr><td>" + r.code + "</td><td>" + r.name + "</td><td>" + r.in + "</td><td>" + r.out +
        "</td><td>" + r.segments + '</td><td class="num">' + r.hours +
        '</td><td><span class="tag ' + tagClass[r.status] + '">' + r.status + "</span></td></tr>"
      ).join("");

      lastDailySummary = [
        { value: present, label: "staff recorded" },
        { value: people.length - present, label: "no scan" },
        { value: openShifts, label: "missing check out" },
        { value: hoursText(totalMinutes), label: "total hours" }
      ];
      el("#daily-summary").innerHTML = lastDailySummary
        .map((s) => "<div><b>" + s.value + "</b><small>" + s.label + "</small></div>").join("");

      if (!res.data || !res.data.length) {
        showMsg(msg, "No attendance recorded for " + date + " yet. The day's records are saved automatically at midnight.", false);
      }
    } catch (error) {
      showMsg(msg, error.message || "Could not load daily attendance.", true);
    }
  }

  // ---- Monthly ----

  async function loadMonthly() {
    const month = el("#monthly-month").value || monthKey(todayKey());
    const bounds = monthBounds(month);
    const body = el("#monthly-body");
    const msg = el("#monthly-msg");
    hideMsg(msg);
    body.innerHTML = "";
    el("#monthly-summary").innerHTML = "";

    try {
      const [people, res] = await Promise.all([
        activeStaff(),
        db.from("attendance_imports").select("*")
          .gte("attendance_date", bounds.start)
          .lte("attendance_date", bounds.end)
      ]);
      if (res.error) throw res.error;

      const byStaff = new Map();
      (res.data || []).forEach((row) => {
        if (!byStaff.has(row.staff_profile_id)) byStaff.set(row.staff_profile_id, []);
        byStaff.get(row.staff_profile_id).push(row);
      });

      let grandMinutes = 0;
      let workedRows = 0;

      lastMonthly = people.map((person) => {
        const rows = byStaff.get(person.id) || [];
        const minutes = rows.reduce((sum, r) => sum + (Number(r.total_minutes) || 0), 0);
        const days = rows.length;
        grandMinutes += minutes;
        workedRows += days;
        return {
          code: person.employee_code, name: person.full_name,
          days: days, hours: hoursText(minutes),
          average: hoursText(days ? Math.round(minutes / days) : 0)
        };
      });
      lastMonthlyMonth = month;

      body.innerHTML = lastMonthly.map((r) =>
        "<tr><td>" + r.code + "</td><td>" + r.name +
        '</td><td class="num">' + r.days +
        '</td><td class="num">' + r.hours +
        '</td><td class="num">' + r.average + "</td></tr>"
      ).join("");

      lastMonthlySummary = [
        { value: people.length, label: "staff" },
        { value: workedRows, label: "days recorded" },
        { value: hoursText(grandMinutes), label: "total hours" }
      ];
      el("#monthly-summary").innerHTML = lastMonthlySummary
        .map((s) => "<div><b>" + s.value + "</b><small>" + s.label + "</small></div>").join("");

      if (!res.data || !res.data.length) {
        showMsg(msg, "No attendance recorded for " + month + ".", false);
      }
    } catch (error) {
      showMsg(msg, error.message || "Could not load monthly attendance.", true);
    }
  }

  // ---- Tabs ----

  function selectTab(name) {
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.classList.toggle("active", tab.dataset.tab === name);
    });
    el("#panel-daily").classList.toggle("hidden", name !== "daily");
    el("#panel-monthly").classList.toggle("hidden", name !== "monthly");
    if (name === "monthly") loadMonthly();
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => selectTab(tab.dataset.tab));
  });

  el("#daily-load").addEventListener("click", loadDaily);
  el("#daily-date").addEventListener("change", loadDaily);
  el("#monthly-load").addEventListener("click", loadMonthly);
  el("#monthly-month").addEventListener("change", loadMonthly);

  el("#daily-png").addEventListener("click", function () {
    const ok = downloadTablePng({
      fileName: "attendance-" + lastDailyDate + ".png",
      title: "Daily Attendance",
      subtitle: new Date(lastDailyDate + "T00:00:00").toLocaleDateString("en-GB", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      }),
      summary: lastDailySummary,
      columns: [
        { label: "Code", key: "code", width: 70 },
        { label: "Name", key: "name", width: 220, bold: true },
        { label: "In", key: "in", width: 80 },
        { label: "Out", key: "out", width: 80 },
        { label: "Segments", key: "segments", width: 200, muted: true },
        { label: "Hours", key: "hours", width: 90, align: "right" },
        { label: "Status", key: "status", width: 140, muted: true }
      ],
      rows: lastDaily
    });
    if (!ok) showMsg(el("#daily-msg"), "Nothing to download yet - load a day first.", true);
  });

  el("#monthly-png").addEventListener("click", function () {
    const ok = downloadTablePng({
      fileName: "attendance-" + lastMonthlyMonth + ".png",
      title: "Monthly Attendance",
      subtitle: new Date(lastMonthlyMonth + "-01T00:00:00").toLocaleDateString("en-GB", {
        month: "long", year: "numeric"
      }),
      summary: lastMonthlySummary,
      columns: [
        { label: "Code", key: "code", width: 70 },
        { label: "Name", key: "name", width: 260, bold: true },
        { label: "Days worked", key: "days", width: 130, align: "right" },
        { label: "Total hours", key: "hours", width: 130, align: "right" },
        { label: "Average / day", key: "average", width: 140, align: "right" }
      ],
      rows: lastMonthly
    });
    if (!ok) showMsg(el("#monthly-msg"), "Nothing to download yet - load a month first.", true);
  });

  // ---- Init ----

  if (!db) {
    showMsg(el("#daily-msg"), "Supabase settings not loaded. Check env.js.", true);
    return;
  }

  if (isStaff) {
    el("#tab-monthly").classList.add("hidden");
  }

  el("#retention-note").textContent =
    "Attendance records are kept for the last " + RETENTION_MONTHS +
    " months. Older months are removed automatically.";

  el("#daily-date").value = todayKey();
  el("#monthly-month").value = monthKey(todayKey());
  loadDaily();
})();
</script>
</body>
</html>
