<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Saved Attendance Records</title>
  <script src="env.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef6f6;
      color: #10242b;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.01em;
    }
    a {
      color: #075f63;
      font-weight: 800;
      text-decoration: none;
    }
    a.back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #d7e7e7;
    }
    a.back-link:active {
      background: #eefafa;
    }
    .card {
      background: white;
      border: 1px solid #d7e7e7;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 65, 70, 0.08);
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 4px;
    }
    label {
      display: grid;
      gap: 6px;
      font-weight: 800;
      font-size: 13px;
      color: #075f63;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    input {
      padding: 10px;
      border: 1px solid #bfd7d7;
      border-radius: 8px;
      font: inherit;
      color: #10242b;
      background: #fbfffe;
    }
    .note {
      color: #5d6b70;
      margin: 10px 0 14px;
      font-size: 14px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d7e7e7;
      border-radius: 10px;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #e1eeee;
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: #075f63;
      background: #eefafa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tbody tr:hover {
      background: #f7fdfd;
    }
    .badge {
      border-radius: 999px;
      padding: 4px 10px;
      display: inline-block;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
    }
    .ok { color: #047857; background: #dcfce7; }
    .off { color: #075985; background: #e0f2fe; }
    .error { color: #991b1b; background: #fee2e2; }
    .missing { color: #92400e; background: #fef3c7; }
    .leave { color: #6d28d9; background: #ede9fe; }
    .half { color: #92400e; background: #fde68a; }
    .short { color: #075985; background: #dbeafe; }

    /* ===== Mobile: the table becomes a stack of readable cards, no sideways scrolling. ===== */
    @media (max-width: 720px) {
      main { padding: 10px; }
      h1 { font-size: 20px; }
      .topbar { flex-wrap: wrap; margin-bottom: 10px; }
      a.back-link { min-height: 40px; font-size: 13px; }
      .controls { gap: 10px; margin-bottom: 2px; }
      .controls label { flex: 1 1 100%; }
      input { min-height: 46px; font-size: 16px; width: 100%; box-sizing: border-box; }
      .card { padding: 10px; border-radius: 12px; }
      .note { font-size: 13px; margin: 8px 2px 12px; }

      .table-wrap {
        border: 0;
        background: transparent;
        overflow: visible;
        border-radius: 0;
      }

      table, thead, tbody, tr, td {
        display: block;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }
      thead { display: none; }

      tbody tr {
        background: #ffffff;
        border: 1px solid #e1eeee;
        border-left: 5px solid #22c55e;
        border-radius: 12px;
        padding: 10px 12px 8px;
        margin-bottom: 10px;
        box-shadow: 0 3px 10px rgba(15, 65, 70, 0.05);
      }

      /* status/highlight scripts color the <td> backgrounds -- fold that color onto the card
         and left border instead of every individual line, so cards read as one solid color block. */
      tbody tr[class] td {
        background: transparent !important;
      }
      tbody tr.daily-status-off { border-left-color: #38bdf8; background: #e0f2fe; }
      tbody tr.daily-status-half { border-left-color: #f59e0b; background: #fef3c7; }
      tbody tr.daily-status-short { border-left-color: #3b82f6; background: #dbeafe; }
      tbody tr.daily-status-leave { border-left-color: #8b5cf6; background: #ede9fe; }
      tbody tr.daily-status-unmarked,
      tbody tr.daily-status-error { border-left-color: #ef4444; background: #fee2e2; }
      tbody tr.daily-status-nofingerprint { border-left-color: #7f1d1d; background: #fdeaea; }
      tbody tr.daily-status-under10 { border-left-color: #fb7185; background: #fff1f2; }

      tbody td {
        border-bottom: 0;
        padding: 4px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      tbody td::before {
        content: attr(data-col);
        font-weight: 700;
        color: #5d6b70;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        flex: none;
      }

      /* Code + name form the card header row: name large and left-aligned, code as a small chip. */
      tbody td:nth-child(1) {
        order: -1;
        justify-content: flex-start;
        gap: 8px;
        padding-bottom: 6px;
        margin-bottom: 4px;
        border-bottom: 1px solid #eef4f4;
      }
      tbody td:nth-child(1)::before {
        content: "";
      }
      tbody td:nth-child(1)::after {
        content: attr(data-code);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: #075f63;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
      }
      tbody td:nth-child(1) { color: transparent; font-size: 0; }
      tbody td:nth-child(2) {
        order: -1;
        justify-content: flex-start;
        padding-bottom: 6px;
        margin-bottom: 2px;
      }
      tbody td:nth-child(2)::before { display: none; }
      tbody td:nth-child(2) {
        font-weight: 900;
        font-size: 15px;
        color: #10242b;
      }

      tbody td:nth-child(3)::before { content: "In"; }
      tbody td:nth-child(4)::before { content: "Out"; }
      tbody td:nth-child(5)::before { content: "Times"; }
      tbody td:nth-child(6)::before { content: "Total"; }
      tbody td:nth-child(7) {
        padding-top: 6px;
        margin-top: 2px;
        border-top: 1px solid rgba(0,0,0,0.05);
      }
      tbody td:nth-child(7)::before { content: "Status"; }

      /* Empty cells (no clock in/out that day) collapse instead of showing an empty row. */
      tbody td:empty { display: none; }

      .badge { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1>Daily Attendance</h1>
        <p class="note" style="margin:2px 0 0;">Your hotel's saved daily attendance records.</p>
      </div>
      <a class="back-link" href="index.html#dashboard">&larr; Dashboard</a>
    </div>

    <section class="card">
      <div class="controls">
        <label>
          Date
          <input id="attendance-date" type="date">
        </label>
      </div>

      <p id="status" class="note">Loading latest saved attendance date...</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Clock in</th>
              <th>Clock out</th>
              <th>Segments</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const HOTEL_ID = "00000000-0000-0000-0000-000000000001";

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function todayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    function clean(value) {
      return String(value || "").trim();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isRemovedCode(value) {
      return clean(value).toLowerCase().includes("removed");
    }

    function codeNumber(value) {
      const n = Number(clean(value).replace(/\D/g, ""));
      return Number.isFinite(n) ? n : 999999;
    }

    function cfg() {
      return window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || window.staffsyncConfig || window.SUPABASE_CONFIG || {};
    }

    async function rest(path) {
      const env = cfg();
      const url = env.SUPABASE_URL || env.supabaseUrl || env.url || window.SUPABASE_URL;
      const key = env.SUPABASE_ANON_KEY || env.supabaseAnonKey || env.anonKey || window.SUPABASE_ANON_KEY;

      if (!url || !key) throw new Error("Supabase settings not found.");

      const res = await fetch(`${url}/rest/v1/${path}`, {
        headers: {
          apikey: key,
          Authorization: `Bearer ${key}`,
          Accept: "application/json"
        }
      });

      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function timeText(value) {
      if (!value) return "";
      return String(value).slice(0, 5);
    }

    function minutesText(minutes) {
      const value = Number(minutes || 0);
      const h = Math.floor(value / 60);
      const m = Math.round(value % 60);
      return `${h}:${pad(m)}`;
    }

    function formatSegments(value) {
      try {
        const parsed = Array.isArray(value) ? value : JSON.parse(value || "[]");
        return parsed.map((seg) => `${seg.in || ""}-${seg.out || ""}`).join(", ");
      } catch {
        return "";
      }
    }

    function statusForRow(row) {
      const source = clean(row.source_name).toUpperCase();
      const total = Number(row.total_minutes || 0);
      const segments = formatSegments(row.segments);

      if (source.includes("SHORT LEAVE")) return "SHORT LEAVE";
      if (source.includes("HALF DAY")) return "HALF DAY";
      if (source.includes("LEAVE")) return "LEAVE";
      if (source.includes("OFF")) return "OFF";
      if ((!row.clock_in || !row.clock_out || !segments) && total > 0) return "ERROR TIME";
      if (total === 0 && !row.clock_in && !row.clock_out) return "OFF";
      return "OK";
    }

    function badge(status) {
      const label = clean(status || "OK").toUpperCase();
      let cls = "ok";

      if (label.includes("ERROR")) cls = "error";
      else if (label === "OFF") cls = "off";
      else if (label === "NO FINGERPRINT") cls = "missing";
      else if (label === "HALF DAY") cls = "half";
      else if (label === "SHORT LEAVE") cls = "short";
      else if (label.includes("LEAVE")) cls = "leave";

      return `<span class="badge ${cls}">${label}</span>`;
    }

    async function activeStaff() {
      const rows = await rest("staff_profiles?select=id,employee_code,full_name&order=employee_code.asc");
      return rows
        .filter((person) => !isRemovedCode(person.employee_code))
        .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));
    }

    async function latestSavedDate() {
      const rows = await rest("attendance_imports?select=attendance_date&order=attendance_date.desc&limit=1");
      return rows[0]?.attendance_date || todayKey();
    }

    async function loadDaily() {
      const date = document.querySelector("#attendance-date").value || todayKey();
      const status = document.querySelector("#status");
      const body = document.querySelector("#body");

      status.textContent = "Loading saved daily attendance...";
      body.innerHTML = "";

      const [people, dayRows] = await Promise.all([
        activeStaff(),
        rest(`attendance_imports?select=*&attendance_date=eq.${date}`)
      ]);

      const byStaff = new Map();
      dayRows.forEach((row) => byStaff.set(row.staff_profile_id, row));

      body.innerHTML = people.map((person) => {
        const row = byStaff.get(person.id);
        const code = clean(person.employee_code);

        if (!row) {
          return `
            <tr>
              <td data-code="${escapeHtml(code)}">${escapeHtml(code)}</td>
              <td>${escapeHtml(person.full_name || "")}</td>
              <td></td>
              <td></td>
              <td></td>
              <td>0:00</td>
              <td>${badge("NO FINGERPRINT")}</td>
            </tr>
          `;
        }

        return `
          <tr>
            <td data-code="${escapeHtml(code)}">${escapeHtml(code)}</td>
            <td>${escapeHtml(person.full_name || row.source_name || "")}</td>
            <td>${timeText(row.clock_in)}</td>
            <td>${timeText(row.clock_out)}</td>
            <td>${formatSegments(row.segments)}</td>
            <td>${minutesText(row.total_minutes)}</td>
            <td>${badge(statusForRow(row))}</td>
          </tr>
        `;
      }).join("");

      status.textContent = `Saved daily attendance records for ${date}.`;
    }

    async function start() {
      const input = document.querySelector("#attendance-date");
      input.value = await latestSavedDate();
      input.addEventListener("change", loadDaily);
      await loadDaily();
    }

    start().catch((error) => {
      document.querySelector("#status").textContent = `Could not load attendance: ${error.message}`;
    });
  </script>
<!-- attendance-daily-highlight-v17-start -->
<style>
  tr.att-under-10 td {
    background: #fff1f2 !important;
  }

  tr.att-no-fingerprint td {
    background: #7f1d1d !important;
    color: #ffffff !important;
  }

  tr.att-no-fingerprint td * {
    color: #ffffff !important;
  }

  tr.att-error-time td {
    background: #fee2e2 !important;
    color: #7f1d1d !important;
  }
</style>

<script>
(function () {
  function clean(value) {
    return String(value || "").trim();
  }

  function norm(value) {
    return clean(value).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function minutesFromText(value) {
    const text = clean(value);
    const match = text.match(/^(\d{1,3}):(\d{2})$/);
    if (!match) return 0;
    return Number(match[1]) * 60 + Number(match[2]);
  }

  function highlightDailyAttendanceRowsV17() {
    document.querySelectorAll("table").forEach((table) => {
      const headers = Array.from(table.querySelectorAll("thead th")).map((th) => norm(th.textContent));

      const codeIndex = headers.indexOf("code");
      const totalIndex = headers.indexOf("total");
      const statusIndex = headers.indexOf("status");
      const hasDailyColumns =
        headers.includes("clockin") &&
        headers.includes("clockout") &&
        headers.includes("segments");

      if (!hasDailyColumns || codeIndex < 0 || totalIndex < 0 || statusIndex < 0) return;

      table.querySelectorAll("tbody tr").forEach((row) => {
        row.classList.remove("att-under-10", "att-no-fingerprint", "att-error-time");

        const cells = row.querySelectorAll("td");
        const code = clean(cells[codeIndex]?.textContent);
        const totalMinutes = minutesFromText(cells[totalIndex]?.textContent);
        const status = clean(cells[statusIndex]?.textContent).toUpperCase();

        const isDileesha = code === "01";
        const isNoFingerprint = status.includes("NO FINGERPRINT") || status.includes("MISSING");
        const isError = status.includes("ERROR");
        const isLeaveOrOff = status.includes("LEAVE") || status.includes("OFF") || status.includes("HALF DAY") || status.includes("SHORT");

        if (isError) {
          row.classList.add("att-error-time");
          return;
        }

        if (isNoFingerprint && !isDileesha) {
          row.classList.add("att-no-fingerprint");
          return;
        }

        if (!isLeaveOrOff && !isNoFingerprint && totalMinutes > 0 && totalMinutes < 600) {
          row.classList.add("att-under-10");
        }
      });
    });
  }

  document.addEventListener("DOMContentLoaded", highlightDailyAttendanceRowsV17);
  document.addEventListener("change", function () {
    setTimeout(highlightDailyAttendanceRowsV17, 500);
    setTimeout(highlightDailyAttendanceRowsV17, 1500);
  });
  document.addEventListener("click", function () {
    setTimeout(highlightDailyAttendanceRowsV17, 500);
    setTimeout(highlightDailyAttendanceRowsV17, 1500);
  });

  setTimeout(highlightDailyAttendanceRowsV17, 800);
  setTimeout(highlightDailyAttendanceRowsV17, 1800);
  setInterval(highlightDailyAttendanceRowsV17, 3000);
})();
</script>
<!-- attendance-daily-highlight-v17-end -->

<!-- attendance-common-unmarked-rule-v19-start -->
<style>
  .att-unmarked {
    color: #991b1b !important;
    background: #fee2e2 !important;
    border-radius: 999px;
    padding: 4px 9px;
    display: inline-block;
    font-weight: 800;
  }

  tr.att-unmarked-row td {
    background: #fee2e2 !important;
    color: #7f1d1d !important;
  }
</style>

<script>
(function () {
  function clean(value) {
    return String(value || "").trim();
  }

  function normalizedHeaders(table) {
    return Array.from(table.querySelectorAll("thead th")).map((th) =>
      clean(th.textContent).toLowerCase().replace(/[^a-z0-9]/g, "")
    );
  }

  function selectedUploadDateV19() {
    return (
      document.querySelector("#attendance-upload-date-v16")?.value ||
      localStorage.getItem("staffsync.lastAttendanceUploadDate") ||
      new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)
    );
  }

  function commonAttendanceStatusV19(rowText, clockIn, clockOut, segments, totalText) {
    const text = clean(rowText).toUpperCase();

    if (text.includes("SHORT LEAVE")) return "SHORT LEAVE";
    if (text.includes("HALF DAY")) return "HALF DAY";
    if (text.includes("LEAVE")) return "LEAVE";
    if (text.includes("OFF")) return "OFF";

    if (
      text.includes("UNMARKED") ||
      text.includes("#VALUE") ||
      text.includes("STARTING DATE") ||
      text.includes("ERROR")
    ) {
      return "UNMARKED";
    }

    const hasIn = Boolean(clean(clockIn));
    const hasOut = Boolean(clean(clockOut));
    const hasSegments = Boolean(clean(segments));
    const total = clean(totalText);

    if ((hasIn && !hasOut) || (!hasIn && hasOut)) return "UNMARKED";
    if ((hasIn || hasOut) && !hasSegments) return "UNMARKED";
    if (total.includes("#VALUE")) return "UNMARKED";

    return "";
  }

  function forcePreviewDateAndStatusV19() {
    const uploadDate = selectedUploadDateV19();

    document.querySelectorAll("table").forEach((table) => {
      const headers = normalizedHeaders(table);
      const dateIndex = headers.indexOf("date");
      const clockInIndex = headers.indexOf("clockin");
      const clockOutIndex = headers.indexOf("clockout");
      const segmentsIndex = headers.indexOf("segments");
      const totalIndex = headers.indexOf("total") >= 0 ? headers.indexOf("total") : headers.indexOf("totalhours");
      const statusIndex = headers.indexOf("status");

      if (dateIndex < 0 && statusIndex < 0) return;

      table.querySelectorAll("tbody tr").forEach((row) => {
        const cells = row.querySelectorAll("td");
        const rowText = row.textContent || "";

        if (dateIndex >= 0 && cells[dateIndex]) {
          cells[dateIndex].textContent = uploadDate;
        }

        if (statusIndex >= 0 && cells[statusIndex]) {
          const common = commonAttendanceStatusV19(
            rowText,
            cells[clockInIndex]?.textContent,
            cells[clockOutIndex]?.textContent,
            cells[segmentsIndex]?.textContent,
            cells[totalIndex]?.textContent
          );

          if (common === "UNMARKED") {
            cells[statusIndex].innerHTML = '<span class="att-unmarked">UNMARKED</span>';
            row.classList.add("att-unmarked-row");
          } else if (common) {
            cells[statusIndex].innerHTML = `<strong>${common}</strong>`;
          }
        }
      });
    });
  }

  function patchFetchSaveUnmarkedV19() {
    if (window.staffsyncUnmarkedFetchPatchedV19) return;
    window.staffsyncUnmarkedFetchPatchedV19 = true;

    const originalFetch = window.fetch;

    window.fetch = async function (url, options) {
      try {
        const textUrl = String(url || "");
        const isAttendanceSave =
          textUrl.includes("/rest/v1/attendance_imports") &&
          options &&
          String(options.method || "").toUpperCase() === "POST" &&
          options.body;

        if (isAttendanceSave) {
          const rows = JSON.parse(options.body);

          if (Array.isArray(rows)) {
            rows.forEach((item) => {
              const rowText = `${item.source_name || ""} ${JSON.stringify(item.segments || [])}`;
              const hasIn = Boolean(item.clock_in);
              const hasOut = Boolean(item.clock_out);
              const hasSegments = Array.isArray(item.segments) ? item.segments.length > 0 : false;

              const source = clean(item.source_name).toUpperCase();

              if (
                !source.includes("LEAVE") &&
                !source.includes("HALF DAY") &&
                !source.includes("SHORT LEAVE") &&
                !source.includes("OFF")
              ) {
                if (
                  source.includes("UNMARKED") ||
                  source.includes("#VALUE") ||
                  source.includes("ERROR") ||
                  source.includes("STARTING DATE") ||
                  (hasIn && !hasOut) ||
                  (!hasIn && hasOut) ||
                  ((hasIn || hasOut) && !hasSegments)
                ) {
                  item.source_name = item.source_name && item.source_name.includes("UNMARKED")
                    ? item.source_name
                    : `UNMARKED - ${item.source_name || "Attendance row"}`;
                  item.clock_out = null;
                  item.segments = [];
                  item.total_minutes = 0;
                }
              }
            });

            options.body = JSON.stringify(rows);
          }
        }
      } catch {}

      return originalFetch.apply(this, arguments);
    };
  }

  function patchSavedReportUnmarkedV19() {
    document.querySelectorAll("table tbody tr").forEach((row) => {
      const text = clean(row.textContent).toUpperCase();
      if (!text.includes("UNMARKED")) return;

      row.classList.add("att-unmarked-row");

      row.querySelectorAll("td, span, strong").forEach((el) => {
        if (clean(el.textContent).toUpperCase() === "UNMARKED") {
          el.classList.add("att-unmarked");
        }
      });
    });
  }

  patchFetchSaveUnmarkedV19();

  document.addEventListener("change", function () {
    setTimeout(forcePreviewDateAndStatusV19, 300);
    setTimeout(patchSavedReportUnmarkedV19, 700);
  });

  document.addEventListener("click", function () {
    setTimeout(forcePreviewDateAndStatusV19, 300);
    setTimeout(patchSavedReportUnmarkedV19, 700);
    setTimeout(forcePreviewDateAndStatusV19, 1500);
  });

  document.addEventListener("DOMContentLoaded", function () {
    forcePreviewDateAndStatusV19();
    patchSavedReportUnmarkedV19();
  });

  setTimeout(forcePreviewDateAndStatusV19, 800);
  setTimeout(patchSavedReportUnmarkedV19, 1200);
  setInterval(function () {
    forcePreviewDateAndStatusV19();
    patchSavedReportUnmarkedV19();
  }, 2500);
})();
</script>
<!-- attendance-common-unmarked-rule-v19-end -->
<!-- daily-attendance-export-highlight-v21-start -->
<style>
  tr.daily-status-off td {
    background: #e0f2fe !important;
    color: #075985 !important;
  }

  tr.daily-status-half td {
    background: #fef3c7 !important;
    color: #92400e !important;
  }

  tr.daily-status-short td {
    background: #dbeafe !important;
    color: #075985 !important;
  }

  tr.daily-status-leave td {
    background: #ede9fe !important;
    color: #5b21b6 !important;
  }

  tr.daily-status-unmarked td,
  tr.daily-status-error td {
    background: #fee2e2 !important;
    color: #991b1b !important;
  }

  tr.daily-status-nofingerprint td {
    background: #7f1d1d !important;
    color: #ffffff !important;
  }

  tr.daily-status-under10 td {
    background: #fff1f2 !important;
    color: #7f1d1d !important;
  }

  tr.daily-status-nofingerprint td *,
  tr.daily-status-off td *,
  tr.daily-status-half td *,
  tr.daily-status-short td *,
  tr.daily-status-leave td *,
  tr.daily-status-unmarked td *,
  tr.daily-status-error td *,
  tr.daily-status-under10 td * {
    color: inherit !important;
  }

</style>

<script>
(function () {
  function clean(value) {
    return String(value || "").trim();
  }

  function norm(value) {
    return clean(value).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function minutesFromText(value) {
    const match = clean(value).match(/^(\d{1,3}):(\d{2})$/);
    if (!match) return 0;
    return Number(match[1]) * 60 + Number(match[2]);
  }

  function dailyTableV21() {
    const bodies = [
      document.querySelector("#saved-attendance-detail-body"),
      document.querySelector("#staff-daily-attendance-body"),
      document.querySelector("#body")
    ].filter(Boolean);

    for (const body of bodies) {
      const table = body.closest("table");
      if (!table) continue;

      const headers = Array.from(table.querySelectorAll("thead th")).map((th) => norm(th.textContent));
      if (
        headers.includes("code") &&
        headers.includes("name") &&
        headers.includes("clockin") &&
        headers.includes("clockout") &&
        headers.includes("segments") &&
        headers.includes("total") &&
        headers.includes("status")
      ) {
        return table;
      }
    }

    return null;
  }

  function classifyDailyRowsV21() {
    const table = dailyTableV21();
    if (!table) return;

    const headers = Array.from(table.querySelectorAll("thead th")).map((th) => norm(th.textContent));
    const codeIndex = headers.indexOf("code");
    const totalIndex = headers.indexOf("total");
    const statusIndex = headers.indexOf("status");

    table.querySelectorAll("tbody tr").forEach((row) => {
      row.classList.remove(
        "daily-status-off",
        "daily-status-half",
        "daily-status-short",
        "daily-status-leave",
        "daily-status-unmarked",
        "daily-status-error",
        "daily-status-nofingerprint",
        "daily-status-under10"
      );

      const cells = row.querySelectorAll("td");
      const code = clean(cells[codeIndex]?.textContent);
      const totalMinutes = minutesFromText(cells[totalIndex]?.textContent);
      const status = clean(cells[statusIndex]?.textContent).toUpperCase();

      if (status.includes("SHORT LEAVE")) {
        row.classList.add("daily-status-short");
      } else if (status.includes("HALF DAY")) {
        row.classList.add("daily-status-half");
      } else if (status === "LEAVE" || status.includes(" LEAVE")) {
        row.classList.add("daily-status-leave");
      } else if (status.includes("OFF")) {
        row.classList.add("daily-status-off");
      } else if (status.includes("UNMARKED")) {
        row.classList.add("daily-status-unmarked");
      } else if (status.includes("ERROR")) {
        row.classList.add("daily-status-error");
      } else if (status.includes("NO FINGERPRINT") || status.includes("MISSING")) {
        if (code !== "01") row.classList.add("daily-status-nofingerprint");
      } else if (totalMinutes > 0 && totalMinutes < 600) {
        row.classList.add("daily-status-under10");
      }
    });
  }

  function csvEscape(value) {
    const text = clean(value).replace(/\s+/g, " ");
    if (/[",\r\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
    return text;
  }

  function selectedDailyDateV21() {
    return (
      document.querySelector("#saved-attendance-date")?.value ||
      document.querySelector("#staff-daily-attendance-date")?.value ||
      document.querySelector("#attendance-date")?.value ||
      new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)
    );
  }

  function exportDailyReportV21() {
    const table = dailyTableV21();
    if (!table) {
      alert("Daily saved report table not found.");
      return;
    }

    const rows = [];
    const headerCells = Array.from(table.querySelectorAll("thead th"));
    rows.push(headerCells.map((cell) => csvEscape(cell.textContent)).join(","));

    table.querySelectorAll("tbody tr").forEach((row) => {
      const cells = Array.from(row.querySelectorAll("td"));
      rows.push(cells.map((cell) => csvEscape(cell.textContent)).join(","));
    });

    const csv = rows.join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const date = selectedDailyDateV21();

    const link = document.createElement("a");
    link.href = url;
    link.download = `staffsync-daily-attendance-${date}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  // Staff-facing page: no export button here (this is a read-only view for staff).
  // Row color-coding (classifyDailyRowsV21) still runs -- that part stays.
  function runDailyExportHighlightV21() {
    classifyDailyRowsV21();
  }

  document.addEventListener("DOMContentLoaded", runDailyExportHighlightV21);
  document.addEventListener("change", function () {
    setTimeout(runDailyExportHighlightV21, 400);
    setTimeout(runDailyExportHighlightV21, 1200);
  });
  document.addEventListener("click", function () {
    setTimeout(runDailyExportHighlightV21, 400);
    setTimeout(runDailyExportHighlightV21, 1200);
  });

  setTimeout(runDailyExportHighlightV21, 800);
  setTimeout(runDailyExportHighlightV21, 1800);
  setInterval(runDailyExportHighlightV21, 3000);
})();
</script>
<!-- daily-attendance-export-highlight-v21-end -->
</body>
</html>
