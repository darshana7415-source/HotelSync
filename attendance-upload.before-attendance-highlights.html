  <script src="env.js">async function saveAttendance(){
  const status=document.querySelector("#save-status");
  const url=cfg("SUPABASE_URL");
  const key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key){
    status.textContent="Supabase settings not found.";
    return;
  }

  const ready=latestRecords.filter(r=>r.status==="OK" && r.matched && r.date);
  if(!ready.length){
    status.textContent="No ready records to save.";
    return;
  }

  status.textContent="Saving attendance...";
  try{
    const staffRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/staff_profiles?select=id,employee_code,full_name",{
      headers:{apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}
    });
    if(!staffRes.ok) throw new Error(await staffRes.text());
    const staffRows=await staffRes.json();

    const payload=ready.map(r=>{
      const person=staffRows.find(s=>norm(s.full_name)===norm(r.matched));
      if(!person) return null;
      const segs=String(r.segments||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
        const p=x.split("-");
        return {in:p[0]||"",out:p[1]||""};
      });
      return {
        hotel_id:"00000000-0000-0000-0000-000000000001",
        staff_profile_id:person.id,
        attendance_date:r.date,
        source_name:r.name,
        clock_in:r.clockIn || null,
        clock_out:r.clockOut || null,
        segments:segs,
        total_minutes:Number(r.minutes)||0,
        source:"hikvision_excel"
      };
    }).filter(Boolean);

    if(!payload.length){
      status.textContent="No records matched StaffSync staff IDs.";
      return;
    }

    const saveRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/attendance_imports?on_conflict=hotel_id,staff_profile_id,attendance_date,source",{
      method:"POST",
      headers:{
        apikey:key,
        Authorization:"Bearer "+key,
        "Content-Type":"application/json",
        Prefer:"resolution=merge-duplicates,return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!saveRes.ok) throw new Error(await saveRes.text());

    status.textContent="Saved "+payload.length+" attendance records to StaffSync.";
  }catch(error){
    status.textContent="Save failed: "+error.message;
  }
}
document.addEventListener("click",e=>{
  if(e.target && e.target.id==="save-attendance") saveAttendance();
});

          <th>Date</th>
          <th>Staff</th>
          <th>Clock in</th>
          <th>Clock out</th>
          <th>Segments</th>

          <th>Status</th>
        </tr>

<script>
const aliases = {
  "dulip": "Duleep De Silva",
  "duleep": "Duleep De Silva",
  "priyantha": "Proyantha SH",
  "proyantha": "Proyantha SH"
};

let knownStaff = [
  "DIleesha De SIlva","Thusitha Paranamana","Duleep De Silva","Proyantha SH","Ajith",
  "Dineth","Ayesha","Supun","Ruwan Kumarasiri","Gayan","Kavindu Lakshan","Ganindu Sathruwan",
  "Muditha Weerarathne","Pathum","Naveen","Sineth","Navod","Kaveesha","Maleesha","Shiromi",
  "Nuwan","Isuri","Nipuni","Sujith","Chathura","Thanuj"
];

function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function cleanName(v){return String(v||"").replace(/\s+/g," ").trim();}
function cfg(name){
  return (window.STAFFSYNC_ENV && window.STAFFSYNC_ENV[name]) ||
    (window.STAFFSYNC_CONFIG && window.STAFFSYNC_CONFIG[name]) ||
    window[name] || "";
}
async function loadLiveStaff(){
  const url=cfg("SUPABASE_URL");
  const key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key) return;
  try{
    const endpoint=url.replace(/\/$/,"")+"/rest/v1/staff_profiles?select=employee_code,full_name&order=employee_code.asc";
    const res=await fetch(endpoint,{headers:{apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}});
    if(!res.ok) return;
    const data=await res.json();
    const names=data.map(x=>x.full_name).filter(Boolean);
    if(names.length) knownStaff=names;
    document.querySelector("#status").textContent="Live StaffSync staff list loaded. Choose the daily attendance sheet.";
  }catch(e){}
}
loadLiveStaff();

function matchStaff(name){
  const n=cleanName(name);
  const alias=aliases[norm(n)] || aliases[String(n).toLowerCase()];
  if(alias) return alias;
  const exact=knownStaff.find(s=>norm(s)===norm(n));
  if(exact) return exact;
  const loose=knownStaff.find(s=>norm(s).includes(norm(n)) || norm(n).includes(norm(s)));
  return loose || "";
}
function badValue(v){
  const s=String(v||"").toLowerCase().trim();
  return !s || s==="off" || s==="starting date" || s==="unmarked" || s.includes("#value");
}
function excelDateToYmd(v){
  if(typeof v==="string"){
    const s=v.trim();
    const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){
      const y=m[3].length===2 ? "20"+m[3] : m[3];
      return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
    }
  }
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  if(v instanceof Date){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  }
  return "";
}
function timeText(v){
  if(badValue(v)) return "";
  if(v instanceof Date) return `${String(v.getHours()).padStart(2,"0")}:${String(v.getMinutes()).padStart(2,"0")}`;
  if(typeof v==="number"){
    const total=Math.round(v*24*60);
    const hh=Math.floor(total/60)%24;
    const mm=total%60;
    return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  }
  const s=String(v||"").trim().replace(/\s+/g,"");
  const m=s.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return "";
  return `${String(m[1]).padStart(2,"0")}:${m[2]}`;
}
function minutes(t){const p=t.split(":").map(Number);return p[0]*60+p[1];}
function duration(start,end){
  if(!start||!end)return 0;
  let a=minutes(start), b=minutes(end);
  if(b<a)b+=1440;
  return b-a;
}
function hours(mins){
  const h=Math.floor(mins/60);
  const m=mins%60;
  return `${h}:${String(m).padStart(2,"0")}`;
}
function decimalHours(text){
  if(!text || !String(text).includes(":")) return 0;
  const p=String(text).split(":").map(Number);
  return p[0] + (p[1]/60);
}
function findHeader(rows){
  for(let r=0;r<Math.min(rows.length,10);r++){
    for(let c=0;c<rows[r].length;c++){
      const text=String(rows[r][c]||"").toLowerCase().replace(/\*/g,"").trim();
      const next=String(rows[r][c+1]||"").toLowerCase().replace(/\*/g,"").trim();
      if(text==="in" && next==="out"){
        return {row:r, firstIn:c, nameCol:Math.max(0,c-1)};
      }
    }
  }
  return {row:0, firstIn:2, nameCol:1};
}
function findDate(rows, header){
  const searchRows=rows.slice(0, Math.min(rows.length, header.row+2));
  for(const row of searchRows){
    for(const cell of row){
      const d=excelDateToYmd(cell);
      if(d) return d;
    }
  }
  return "";
}
function parseSheet(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  const header=findHeader(rows);
  const manualDate=document.querySelector("#attendance-date")?.value || "";
  const date=manualDate || findDate(rows, header);
  const out=[];

  for(let idx=header.row+1; idx<rows.length; idx++){
    const row=rows[idx];
    const name=cleanName(row[header.nameCol]);
    if(!name) continue;

    const lowered=name.toLowerCase();
    if(["in","out","shift1","shift2","shift3","total","left early","ot"].includes(lowered)) continue;
    if(lowered.includes("date") || lowered.includes("total")) continue;

    const rawFirst=String(row[header.firstIn]||"").toLowerCase().trim();
    if(rawFirst==="off"){
      out.push({date,name,matched:matchStaff(name),clockIn:"",clockOut:"",segments:"",hours:0,status:"OFF"});
      continue;
    }

    const pairs=[
      [row[header.firstIn],row[header.firstIn+1]],
      [row[header.firstIn+2],row[header.firstIn+3]],
      [row[header.firstIn+4],row[header.firstIn+5]]
    ].map(p=>[timeText(p[0]),timeText(p[1])]).filter(p=>p[0]||p[1]);

    const valid=pairs.filter(p=>p[0]&&p[1]);
    if(!pairs.length && !valid.length) continue;

    const total=valid.reduce((sum,p)=>sum+duration(p[0],p[1]),0);
    const matched=matchStaff(name);

    let status="OK";
    if(!matched) status="UNMATCHED";
    else if(!valid.length) status="NO VALID PUNCH";
    else if(valid.length!==pairs.length) status="MISSING IN/OUT";

    out.push({
      date,
      name,
      matched,
      clockIn: valid[0]?.[0] || "",
      clockOut: valid[valid.length-1]?.[1] || "",
      segments: valid.map(p=>p[0]+"-"+p[1]).join(", "),
      hours: hours(total),
      minutes: total,
      status
    });
  }
  return out;
}
function applyPreviewMonthlyHours(records){
  const totals = {};
  records.forEach(r=>{
    const staff = r.matched || r.name || "";
    const month = String(r.date || "").slice(0,7);
    if(!staff || !month || r.status !== "OK") return;
    const key = staff + "|" + month;
    totals[key] = (totals[key] || 0) + (Number(r.minutes) || 0);
  });
  records.forEach(r=>{
    const staff = r.matched || r.name || "";
    const month = String(r.date || "").slice(0,7);
    const key = staff + "|" + month;
    r.monthlyHours = hours(totals[key] || 0);
  });
}
let latestRecords = [];
function render(records){
  latestRecords = records;
  const saveButton = document.querySelector("#save-attendance");
  if(saveButton) saveButton.disabled = !records.some(r=>r.status==="OK" && r.matched);

  const body=document.querySelector("#body");
  body.innerHTML=records.map(r=>`
    <tr>
      <td>${r.date}</td>
      <td>${r.matched || r.name || "-"}</td>
      <td>${r.clockIn}</td>
      <td>${r.clockOut}</td>
      <td>${r.segments}</td>
      <td>${r.hours}</td>
      <td>${r.monthlyHours || r.hours}</td>
      <td class="${r.status==="OK"?"ok":(r.status==="UNMATCHED"||r.status==="NO VALID PUNCH"?"bad":"warn")}">${r.status}</td>
    </tr>
  `).join("");
  document.querySelector("#table").hidden=false;

  const ok=records.filter(r=>r.status==="OK").length;
  const unmatched=records.filter(r=>r.status==="UNMATCHED").length;
  const warnings=records.filter(r=>r.status!=="OK"&&r.status!=="UNMATCHED").length;
  const totalMinutes=records.reduce((s,r)=>s+(Number(r.minutes)||0),0);
  const totalHours=hours(totalMinutes);
  document.querySelector("#summary").innerHTML=`
    <div><b>${records.length}</b><br>Total rows</div>
    <div><b>${ok}</b><br>Ready records</div>
    <div><b>${unmatched}</b><br>Unmatched names</div>
    <div><b>${totalHours}</b><br>Total hours</div>
  `;
  document.querySelector("#status").textContent=`Preview loaded. ${warnings} warning rows found.`;
}
document.querySelector("#file").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:"array",cellDates:true});
  let all=[];
  wb.SheetNames.forEach(name=>{all=all.concat(parseSheet(wb.Sheets[name]));});
  const manualDate=document.querySelector("#attendance-date")?.value || "";
  if(manualDate){
    all=all.map(row=>({...row,date:manualDate}));
  }
  applyPreviewMonthlyHours(all);
  render(all);
});
async function saveAttendance(){
  const status=document.querySelector("#save-status");
  const url=cfg("SUPABASE_URL");
  const key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key){
    status.textContent="Supabase settings not found.";
    return;
  }

  const ready=latestRecords.filter(r=>r.status==="OK" && r.matched && r.date);
  if(!ready.length){
    status.textContent="No ready records to save.";
    return;
  }

  status.textContent="Saving attendance...";
  try{
    const staffRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/staff_profiles?select=id,employee_code,full_name",{
      headers:{apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}
    });
    if(!staffRes.ok) throw new Error(await staffRes.text());
    const staffRows=await staffRes.json();

    const payload=ready.map(r=>{
      const person=staffRows.find(s=>norm(s.full_name)===norm(r.matched));
      if(!person) return null;
      const segs=String(r.segments||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
        const p=x.split("-");
        return {in:p[0]||"",out:p[1]||""};
      });
      return {
        hotel_id:"00000000-0000-0000-0000-000000000001",
        staff_profile_id:person.id,
        attendance_date:r.date,
        source_name:r.name,
        clock_in:r.clockIn || null,
        clock_out:r.clockOut || null,
        segments:segs,
        total_minutes:Number(r.minutes)||0,
        source:"hikvision_excel"
      };
    }).filter(Boolean);

    if(!payload.length){
      status.textContent="No records matched StaffSync staff IDs.";
      return;
    }

    const saveRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/attendance_imports?on_conflict=hotel_id,staff_profile_id,attendance_date,source",{
      method:"POST",
      headers:{
        apikey:key,
        Authorization:"Bearer "+key,
        "Content-Type":"application/json",
        Prefer:"resolution=merge-duplicates,return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!saveRes.ok) throw new Error(await saveRes.text());

    status.textContent="Saved "+payload.length+" attendance records to StaffSync.";
  }catch(error){
    status.textContent="Save failed: "+error.message;
  }
}
document.addEventListener("click",e=>{
  if(e.target && e.target.id==="save-attendance") saveAttendance();
});
</script>

<script>
(function () {
  const REPORT_ID = "attendance-canonical-save-report-v8";
  const HOTEL_ID = "00000000-0000-0000-0000-000000000001";

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function todayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function todayMonth() {
    return todayKey().slice(0, 7);
  }

  function monthBounds(monthKey) {
    const parts = String(monthKey || todayMonth()).split("-").map(Number);
    const start = new Date(parts[0], parts[1] - 1, 1);
    const end = new Date(parts[0], parts[1], 0);
    return {
      start: `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`,
      end: `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}`
    };
  }

  function clean(value) {
    return String(value || "").trim();
  }

  function norm(value) {
    return clean(value).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function isRemovedCode(value) {
    return clean(value).toLowerCase().includes("removed");
  }

  function codeNumber(value) {
    const n = Number(clean(value).replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  function cfg() {
    return window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || window.staffsyncConfig || window.SUPABASE_CONFIG || {};
  }

  async function rest(path, options) {
    const env = cfg();
    const url = env.SUPABASE_URL || env.supabaseUrl || env.url || window.SUPABASE_URL;
    const key = env.SUPABASE_ANON_KEY || env.supabaseAnonKey || env.anonKey || window.SUPABASE_ANON_KEY;
    if (!url || !key) throw new Error("Supabase settings not found.");

    const res = await fetch(`${url}/rest/v1/${path}`, {
      ...(options || {}),
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        Accept: "application/json",
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=representation",
        ...((options && options.headers) || {})
      }
    });

    if (!res.ok) throw new Error(await res.text());
    return res.status === 204 ? [] : res.json();
  }

  async function activeStaff() {
    const rows = await rest("staff_profiles?select=id,employee_code,full_name&order=employee_code.asc");
    return rows
      .filter((person) => !isRemovedCode(person.employee_code))
      .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));
  }

  function selectedUploadDate() {
    const inputs = Array.from(document.querySelectorAll("input[type='date']"));
    const good = inputs.find((input) =>
      /attendance|hikvision|import|upload/i.test(input.id || input.name || "")
    ) || inputs[0];

    return good?.value || todayKey();
  }

  function selectedReportMonth() {
    return document.querySelector("#saved-attendance-month")?.value || todayMonth();
  }

  function selectedReportDate() {
    return document.querySelector("#saved-attendance-date")?.value || selectedUploadDate() || todayKey();
  }

  function minutesFromText(value) {
    const text = clean(value);
    if (!text || text === "0") return 0;

    const hm = text.match(/^(\d{1,3}):(\d{2})$/);
    if (hm) return Number(hm[1]) * 60 + Number(hm[2]);

    const decimal = Number(text);
    if (Number.isFinite(decimal)) return Math.round(decimal * 60);

    return 0;
  }

  function minutesText(minutes) {
    const value = Number(minutes || 0);
    const h = Math.floor(value / 60);
    const m = Math.round(value % 60);
    return `${h}:${pad(m)}`;
  }

  function timeText(value) {
    if (!value) return null;
    const match = clean(value).match(/(\d{1,2}):(\d{2})/);
    if (!match) return null;
    return `${pad(match[1])}:${match[2]}`;
  }

  function parseSegmentsText(value) {
    const text = clean(value);
    if (!text) return [];

    return text.split(",")
      .map((part) => part.trim())
      .map((part) => {
        const match = part.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
        if (!match) return null;
        return { in: timeText(match[1]), out: timeText(match[2]) };
      })
      .filter(Boolean);
  }

  function formatSegments(value) {
    try {
      const parsed = Array.isArray(value) ? value : JSON.parse(value || "[]");
      return parsed.map((seg) => `${seg.in || ""}-${seg.out || ""}`).join(", ");
    } catch {
      return "";
    }
  }

  function statusFromRowText(text, fallback) {
    const upper = clean(text).toUpperCase();

    if (upper.includes("SHORT LEAVE")) return "SHORT LEAVE";
    if (upper.includes("HALF DAY")) return "HALF DAY";
    if (upper.includes("LEAVE")) return "LEAVE";
    if (upper.includes("OFF")) return "OFF";
    if (upper.includes("ERROR") || upper.includes("#VALUE") || upper.includes("UNMARKED") || upper.includes("STARTING DATE")) return "ERROR TIME";
    if (upper.includes("UNMATCHED")) return "UNMATCHED";
    if (upper.includes("NO FINGERPRINT") || upper.includes("MISSING")) return "NO FINGERPRINT";
    return fallback || "OK";
  }

  function statusBadge(status) {
    const label = clean(status || "OK").toUpperCase();
    let cls = "att-ok";
    if (label.includes("ERROR")) cls = "att-error";
    else if (label.includes("OFF")) cls = "att-off";
    else if (label.includes("NO FINGERPRINT") || label.includes("MISSING")) cls = "att-missing";
    else if (label.includes("LEAVE") || label.includes("HALF DAY") || label.includes("SHORT")) cls = "att-leave";
    return `<span class="${cls}">${label}</span>`;
  }

  function cellByHeader(cells, headerMap, names) {
    for (const name of names) {
      const index = headerMap.get(name);
      if (index !== undefined) return clean(cells[index]?.textContent);
    }
    return "";
  }

  function findUploadPreviewTable() {
    const tables = Array.from(document.querySelectorAll("table"));
    return tables.find((table) => {
      const text = table.textContent || "";
      return text.includes("Segments") && text.includes("Clock") && text.includes("Status");
    });
  }

  function previewRowsFromTable(staff) {
    const table = findUploadPreviewTable();
    if (!table) throw new Error("Upload preview table not found. Upload the Hikvision Excel first.");

    const headers = Array.from(table.querySelectorAll("thead th")).map((th) => norm(th.textContent));
    const headerMap = new Map(headers.map((name, index) => [name, index]));
    const bodyRows = Array.from(table.querySelectorAll("tbody tr"));

    const byCode = new Map(staff.map((person) => [clean(person.employee_code), person]));
    const byName = new Map(staff.map((person) => [norm(person.full_name), person]));
    const code04 = byCode.get("04");

    return bodyRows.map((row) => {
      const cells = Array.from(row.querySelectorAll("td"));
      const rowText = row.textContent || "";

      const codeFromCell = cellByHeader(cells, headerMap, ["code", "employeecode", "staffcode"]);
      const sourceName = cellByHeader(cells, headerMap, ["sheetname", "sourcename", "name"]);
      const matchedName = cellByHeader(cells, headerMap, ["matchedstaff", "staff", "fullname"]);
      const clockInText = cellByHeader(cells, headerMap, ["clockin", "in"]);
      const clockOutText = cellByHeader(cells, headerMap, ["clockout", "out"]);
      const segmentsText = cellByHeader(cells, headerMap, ["segments"]);
      const totalText = cellByHeader(cells, headerMap, ["totalhours", "total"]);
      const statusText = cellByHeader(cells, headerMap, ["status"]);

      let person = null;

      if (codeFromCell) person = byCode.get(codeFromCell);
      if (!person && code04 && (norm(sourceName).includes("priyantha") || norm(sourceName).includes("proyantha") || norm(matchedName).includes("priyantha") || norm(matchedName).includes("proyantha"))) person = code04;
      if (!person && matchedName) person = byName.get(norm(matchedName));
      if (!person && sourceName) person = byName.get(norm(sourceName));

      const status = statusFromRowText(rowText, statusText);
      const segments = parseSegmentsText(segmentsText);
      const clockIn = timeText(clockInText) || segments[0]?.in || null;
      const clockOut = timeText(clockOutText) || segments[segments.length - 1]?.out || null;
      const totalMinutes = minutesFromText(totalText);

      return {
        rowText,
        person,
        sourceName: sourceName || matchedName || "",
        status,
        clockIn,
        clockOut,
        segments,
        totalMinutes
      };
    });
  }

  async function savePreviewToSupabase() {
    const status = document.querySelector("#saved-attendance-status") || document.querySelector("#shift-import-result") || document.querySelector("p");
    if (status) status.textContent = "Saving corrected attendance records...";

    const staff = await activeStaff();
    const attendanceDate = selectedUploadDate();
    const rows = previewRowsFromTable(staff);

    const saveRows = rows
      .filter((item) => item.person)
      .filter((item) => !["UNMATCHED", "NO FINGERPRINT", "MISSING"].includes(item.status))
      .map((item) => {
        const sourceStatus = item.status === "OK" ? item.sourceName : `${item.status} - ${item.sourceName || item.person.full_name}`;
        return {
          hotel_id: HOTEL_ID,
          staff_profile_id: item.person.id,
          attendance_date: attendanceDate,
          source_name: sourceStatus,
          clock_in: item.status === "OK" || item.status === "ERROR TIME" ? item.clockIn : null,
          clock_out: item.status === "OK" || item.status === "ERROR TIME" ? item.clockOut : null,
          segments: item.status === "OK" || item.status === "ERROR TIME" ? item.segments : [],
          total_minutes: item.status === "OK" ? item.totalMinutes : 0,
          source: "hikvision_excel"
        };
      });

    if (!saveRows.length) throw new Error("No matched rows ready to save.");

    await rest("attendance_imports?on_conflict=hotel_id,staff_profile_id,attendance_date,source", {
      method: "POST",
      body: JSON.stringify(saveRows)
    });

    if (status) status.textContent = `Saved ${saveRows.length} attendance record${saveRows.length === 1 ? "" : "s"} for ${attendanceDate}.`;

    await loadReport();
  }

  function ensureReportUi() {
    if (document.querySelector(`#${REPORT_ID}`)) return;

    const host = document.createElement("section");
    host.id = REPORT_ID;
    host.className = "saved-attendance-report";
    host.innerHTML = `
      <h2>Saved Attendance Report</h2>
      <p class="saved-report-note">Use Save attendance to StaffSync after previewing Excel. Monthly totals and daily records are read from saved data.</p>

      <div class="saved-attendance-controls">
        <label>
          Report month
          <input id="saved-attendance-month" type="month" value="${todayMonth()}">
        </label>
        <label>
          Daily record date
          <input id="saved-attendance-date" type="date" value="${selectedUploadDate() || todayKey()}">
        </label>
        <button id="load-saved-attendance" type="button">Load saved report</button>
      </div>

      <p id="saved-attendance-status" class="saved-report-note">Choose month/date and load report.</p>

      <h3>Monthly total hours</h3>
      <div class="saved-attendance-table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Name</th><th>Days</th><th>Total hours</th></tr>
          </thead>
          <tbody id="saved-attendance-summary-body"></tbody>
        </table>
      </div>

      <h3>Daily saved records</h3>
      <div class="saved-attendance-table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Name</th><th>Clock in</th><th>Clock out</th><th>Segments</th><th>Total</th><th>Status</th></tr>
          </thead>
          <tbody id="saved-attendance-detail-body"></tbody>
        </table>
      </div>
    `;

    document.body.appendChild(host);
  }

  function statusForSavedRow(row) {
    const source = clean(row.source_name).toUpperCase();
    const total = Number(row.total_minutes || 0);
    const segments = formatSegments(row.segments);

    if (source.includes("SHORT LEAVE")) return "SHORT LEAVE";
    if (source.includes("HALF DAY")) return "HALF DAY";
    if (source.includes("LEAVE")) return "LEAVE";
    if (source.includes("OFF")) return "OFF";
    if ((!row.clock_in || !row.clock_out || !segments) && total > 0) return "ERROR TIME";
    if (total === 0 && !row.clock_in && !row.clock_out) return "OFF";
    return "OK";
  }

  async function loadReport() {
    ensureReportUi();

    const month = selectedReportMonth();
    const selectedDate = selectedReportDate();
    const bounds = monthBounds(month);

    const status = document.querySelector("#saved-attendance-status");
    const summaryBody = document.querySelector("#saved-attendance-summary-body");
    const detailBody = document.querySelector("#saved-attendance-detail-body");

    status.textContent = "Loading saved attendance...";
    summaryBody.innerHTML = "";
    detailBody.innerHTML = "";

    const [people, monthRows, dayRows] = await Promise.all([
      activeStaff(),
      rest(`attendance_imports?select=*&attendance_date=gte.${bounds.start}&attendance_date=lte.${bounds.end}&order=attendance_date.asc`),
      rest(`attendance_imports?select=*&attendance_date=eq.${selectedDate}`)
    ]);

    const monthByStaff = new Map();
    monthRows.forEach((row) => {
      if (!monthByStaff.has(row.staff_profile_id)) monthByStaff.set(row.staff_profile_id, []);
      monthByStaff.get(row.staff_profile_id).push(row);
    });

    summaryBody.innerHTML = people.map((person) => {
      const rows = monthByStaff.get(person.id) || [];
      const minutes = rows.reduce((sum, row) => sum + Number(row.total_minutes || 0), 0);
      const workingDays = rows.filter((row) => statusForSavedRow(row) === "OK").length;

      return `
        <tr>
          <td>${clean(person.employee_code)}</td>
          <td>${person.full_name || ""}</td>
          <td>${workingDays}</td>
          <td>${minutesText(minutes)}</td>
        </tr>
      `;
    }).join("");

    const dayByStaff = new Map();
    dayRows.forEach((row) => dayByStaff.set(row.staff_profile_id, row));

    detailBody.innerHTML = people.map((person) => {
      const row = dayByStaff.get(person.id);

      if (!row) {
        return `
          <tr>
            <td>${clean(person.employee_code)}</td>
            <td>${person.full_name || ""}</td>
            <td></td>
            <td></td>
            <td></td>
            <td>0:00</td>
            <td>${statusBadge("NO FINGERPRINT")}</td>
          </tr>
        `;
      }

      const statusText = statusForSavedRow(row);

      return `
        <tr>
          <td>${clean(person.employee_code)}</td>
          <td>${person.full_name || row.source_name || ""}</td>
          <td>${timeText(row.clock_in) || ""}</td>
          <td>${timeText(row.clock_out) || ""}</td>
          <td>${formatSegments(row.segments)}</td>
          <td>${minutesText(row.total_minutes)}</td>
          <td>${statusBadge(statusText)}</td>
        </tr>
      `;
    }).join("");

    status.textContent = `Monthly totals for ${month}; daily saved records for ${selectedDate}.`;
  }

  document.addEventListener("click", function (event) {
    const button = event.target?.closest("button");
    if (!button) return;

    const text = clean(button.textContent).toLowerCase();

    if (text.includes("save attendance")) {
      event.preventDefault();
      event.stopImmediatePropagation();
      savePreviewToSupabase().catch((error) => {
        const status = document.querySelector("#saved-attendance-status");
        if (status) status.textContent = `Could not save attendance: ${error.message}`;
        alert(`Could not save attendance: ${error.message}`);
      });
      return;
    }

    if (button.id === "load-saved-attendance") {
      event.preventDefault();
      loadReport().catch((error) => {
        const status = document.querySelector("#saved-attendance-status");
        if (status) status.textContent = `Could not load report: ${error.message}`;
      });
    }
  }, true);

  document.addEventListener("change", function (event) {
    if (event.target?.matches("#saved-attendance-month,#saved-attendance-date")) {
      loadReport().catch(function () {});
    }
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      ensureReportUi();
      setTimeout(function () { loadReport().catch(function () {}); }, 800);
    });
  } else {
    ensureReportUi();
    setTimeout(function () { loadReport().catch(function () {}); }, 800);
  }
})();
</script>

<script>
(function () {
  function roleV10() {
    const queryRole = new URLSearchParams(location.search).get("role");
    if (queryRole) return String(queryRole).toLowerCase();

    try {
      return String(
        localStorage.getItem("staffsync.currentRole") ||
        localStorage.getItem("staffsync.role") ||
        sessionStorage.getItem("staffsync.currentRole") ||
        sessionStorage.getItem("staffsync.role") ||
        ""
      ).toLowerCase();
    } catch {
      return "";
    }
  }

  if (roleV10() !== "staff") return;

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function todayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function clean(value) {
    return String(value || "").trim();
  }

  function isRemovedCode(value) {
    return clean(value).toLowerCase().includes("removed");
  }

  function codeNumber(value) {
    const n = Number(clean(value).replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  function timeText(value) {
    if (!value) return "";
    return String(value).slice(0, 5);
  }

  function minutesText(minutes) {
    const value = Number(minutes || 0);
    const h = Math.floor(value / 60);
    const m = Math.round(value % 60);
    return `${h}:${pad(m)}`;
  }

  function cfg() {
    return window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || window.staffsyncConfig || window.SUPABASE_CONFIG || {};
  }

  async function rest(path) {
    const env = cfg();
    const url = env.SUPABASE_URL || env.supabaseUrl || env.url || window.SUPABASE_URL;
    const key = env.SUPABASE_ANON_KEY || env.supabaseAnonKey || env.anonKey || window.SUPABASE_ANON_KEY;
    if (!url || !key) throw new Error("Supabase settings not found.");

    const res = await fetch(`${url}/rest/v1/${path}`, {
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        Accept: "application/json"
      }
    });

    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function formatSegments(value) {
    try {
      const parsed = Array.isArray(value) ? value : JSON.parse(value || "[]");
      return parsed.map((seg) => `${seg.in || ""}-${seg.out || ""}`).join(", ");
    } catch {
      return "";
    }
  }

  function statusForRow(row) {
    const source = clean(row.source_name).toUpperCase();
    const total = Number(row.total_minutes || 0);
    const segments = formatSegments(row.segments);

    if (source.includes("SHORT LEAVE")) return "SHORT LEAVE";
    if (source.includes("HALF DAY")) return "HALF DAY";
    if (source.includes("LEAVE")) return "LEAVE";
    if (source.includes("OFF")) return "OFF";
    if ((!row.clock_in || !row.clock_out || !segments) && total > 0) return "ERROR TIME";
    if (total === 0 && !row.clock_in && !row.clock_out) return "OFF";
    return "OK";
  }

  function badge(status) {
    const label = clean(status || "OK").toUpperCase();
    let cls = "att-ok";
    if (label.includes("ERROR")) cls = "att-error";
    else if (label.includes("OFF")) cls = "att-off";
    else if (label.includes("NO FINGERPRINT")) cls = "att-missing";
    else if (label.includes("LEAVE") || label.includes("HALF DAY") || label.includes("SHORT")) cls = "att-leave";
    return `<span class="${cls}">${label}</span>`;
  }

  async function loadDaily() {
    const date = document.querySelector("#staff-daily-attendance-date").value || todayKey();
    const status = document.querySelector("#staff-daily-attendance-status");
    const body = document.querySelector("#staff-daily-attendance-body");

    status.textContent = "Loading daily attendance...";
    body.innerHTML = "";

    const [staffRows, dayRows] = await Promise.all([
      rest("staff_profiles?select=id,employee_code,full_name&order=employee_code.asc"),
      rest(`attendance_imports?select=*&attendance_date=eq.${date}`)
    ]);

    const staff = staffRows
      .filter((person) => !isRemovedCode(person.employee_code))
      .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));

    const byStaff = new Map();
    dayRows.forEach((row) => byStaff.set(row.staff_profile_id, row));

    body.innerHTML = staff.map((person) => {
      const row = byStaff.get(person.id);

      if (!row) {
        return `
          <tr>
            <td>${clean(person.employee_code)}</td>
            <td>${person.full_name || ""}</td>
            <td></td>
            <td></td>
            <td></td>
            <td>0:00</td>
            <td>${badge("NO FINGERPRINT")}</td>
          </tr>
        `;
      }

      return `
        <tr>
          <td>${clean(person.employee_code)}</td>
          <td>${person.full_name || row.source_name || ""}</td>
          <td>${timeText(row.clock_in)}</td>
          <td>${timeText(row.clock_out)}</td>
          <td>${formatSegments(row.segments)}</td>
          <td>${minutesText(row.total_minutes)}</td>
          <td>${badge(statusForRow(row))}</td>
        </tr>
      `;
    }).join("");

    status.textContent = `Daily attendance records for ${date}.`;
  }

  function showStaffDailyPage() {
    document.body.innerHTML = `
      <main class="staff-daily-attendance-lock">
        <h1>Daily Attendance Records</h1>
        <p>Staff view only. Upload and monthly reports are hidden.</p>

        <div class="staff-attendance-controls">
          <label>
            Daily record date
            <input id="staff-daily-attendance-date" type="date" value="${todayKey()}">
          </label>
          <button id="staff-load-daily-attendance" type="button">Load daily records</button>
          <a href="index.html#dashboard">Back to dashboard</a>
        </div>

        <p id="staff-daily-attendance-status">Choose a date and load daily attendance.</p>

        <div class="staff-attendance-table-wrap">
          <table class="staff-attendance-table">
            <thead>
              <tr><th>Code</th><th>Name</th><th>Clock in</th><th>Clock out</th><th>Segments</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody id="staff-daily-attendance-body"></tbody>
          </table>
        </div>
      </main>
    `;

    document.querySelector("#staff-load-daily-attendance").addEventListener("click", () => {
      loadDaily().catch((error) => {
        document.querySelector("#staff-daily-attendance-status").textContent = `Could not load attendance: ${error.message}`;
      });
    });

    document.querySelector("#staff-daily-attendance-date").addEventListener("change", () => {
      loadDaily().catch(function () {});
    });

    loadDaily().catch(function () {});
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", showStaffDailyPage);
  } else {
    showStaffDailyPage();
  }
})();
</script>

<script>

  function recolorLeaveStatusesV12() {
    if (!isStaffAttendanceV12()) return;

    document.querySelectorAll("span, strong, td").forEach((el) => {
      const text = String(el.textContent || "").trim().toUpperCase();

      if (text === "SHORT LEAVE") {

        el.classList.remove("att-leave", "att-off", "att-ok");

  function removeStaffLoadButtonsV12() {

    document.body.classList.add("staff-daily-only-final");

    document.querySelectorAll("button").forEach((button) => {
      const text = String(button.textContent || "").toLowerCase();
      if (

        text.includes("load saved") ||
        text.includes("load report")
      ) {
        button.remove();

    const title = document.querySelector("h1");
    if (title) title.textContent = "Daily Saved Attendance Records";

    document.querySelectorAll("p").forEach((p) => {
      const text = String(p.textContent || "");
      if (text.includes("Choose a date") || text.includes("Staff view only")) {
        p.textContent = "Select a date to see saved daily attendance records.";
      }
    });

    recolorLeaveStatusesV12();

  document.addEventListener("DOMContentLoaded", removeStaffLoadButtonsV12);

  document.addEventListener("change", function (event) {
    if (isStaffAttendanceV12() && event.target?.matches("input[type='date']")) {
      setTimeout(removeStaffLoadButtonsV12, 300);
      setTimeout(recolorLeaveStatusesV12, 900);
    }
  });

  setTimeout(removeStaffLoadButtonsV12, 300);
  setTimeout(removeStaffLoadButtonsV12, 1200);
  setInterval(removeStaffLoadButtonsV12, 2500);
})();

<script>
(function () {
  function saveUploadedAttendanceDateV13() {
    const dateInputs = Array.from(document.querySelectorAll("input[type='date']"));
    const uploadDate =
      dateInputs.find((input) => /attendance|hikvision|import|upload/i.test(input.id || input.name || "")) ||
      dateInputs[0];

    if (uploadDate?.value) {
      localStorage.setItem("staffsync.lastAttendanceUploadDate", uploadDate.value);

      const dailyDate =
        document.querySelector("#saved-attendance-date") ||
        document.querySelector("#staff-daily-attendance-date");

      if (dailyDate) {
        dailyDate.value = uploadDate.value;
        dailyDate.dispatchEvent(new Event("change", { bubbles: true }));
      }
    }
  }

  function applyLastUploadedAttendanceDateV13() {
    const last = localStorage.getItem("staffsync.lastAttendanceUploadDate");
    if (!last) return;

    const dailyDate =
      document.querySelector("#saved-attendance-date") ||
      document.querySelector("#staff-daily-attendance-date");

    if (dailyDate && dailyDate.value !== last) {
      dailyDate.value = last;
      dailyDate.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  document.addEventListener("click", function (event) {
    const button = event.target?.closest("button");
    const text = String(button?.textContent || "").toLowerCase();

    if (text.includes("save attendance")) {
      setTimeout(saveUploadedAttendanceDateV13, 500);
      setTimeout(saveUploadedAttendanceDateV13, 1500);
      setTimeout(saveUploadedAttendanceDateV13, 3000);
    }
  });

  document.addEventListener("change", function (event) {
    if (event.target?.matches("input[type='date']")) {
      const id = event.target.id || "";
      if (/attendance|hikvision|import|upload/i.test(id)) {
        localStorage.setItem("staffsync.lastAttendanceUploadDate", event.target.value);
      }
    }
  });

  document.addEventListener("DOMContentLoaded", applyLastUploadedAttendanceDateV13);
  setTimeout(applyLastUploadedAttendanceDateV13, 700);
  setTimeout(applyLastUploadedAttendanceDateV13, 1800);
})();
</script>

<!-- attendance-date-total-fix-v16-start -->
<script>
(function () {
  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function todayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function clean(value) {
    return String(value || "").trim();
  }

  function timeToMinutes(value) {
    const match = clean(value).match(/^(\d{1,2}):(\d{2})$/);
    if (!match) return null;
    return Number(match[1]) * 60 + Number(match[2]);
  }

  function totalMinutesFromSegmentsText(text) {
    const segments = clean(text).split(",").map((part) => part.trim()).filter(Boolean);
    let total = 0;

    segments.forEach((part) => {
      const match = part.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
      if (!match) return;

      const start = timeToMinutes(match[1]);
      const end = timeToMinutes(match[2]);
      if (start === null || end === null) return;

      total += end >= start ? end - start : (1440 - start) + end;
    });

    return total;
  }

  function totalMinutesFromSegmentsJson(value) {
    try {
      const parsed = Array.isArray(value) ? value : JSON.parse(value || "[]");
      return parsed.reduce((sum, seg) => {
        const start = timeToMinutes(seg.in);
        const end = timeToMinutes(seg.out);
        if (start === null || end === null) return sum;
        return sum + (end >= start ? end - start : (1440 - start) + end);
      }, 0);
    } catch {
      return 0;
    }
  }

  function ensureUploadDateInputV16() {
    if (document.querySelector("#attendance-upload-date-v16")) return;

    const firstFile = document.querySelector("input[type='file']");
    const host =
      firstFile?.closest("section, article, form, .card, .panel, div") ||
      document.body;

    const wrap = document.createElement("label");
    wrap.style.display = "grid";
    wrap.style.gap = "6px";
    wrap.style.fontWeight = "800";
    wrap.style.margin = "10px 0";
    wrap.innerHTML = `
      Attendance upload date
      <input id="attendance-upload-date-v16" type="date" value="${localStorage.getItem("staffsync.lastAttendanceUploadDate") || todayKey()}">
    `;

    host.insertBefore(wrap, host.firstChild);
  }

  function selectedUploadDateV16() {
    const explicit = document.querySelector("#attendance-upload-date-v16");
    if (explicit?.value) return explicit.value;

    return localStorage.getItem("staffsync.lastAttendanceUploadDate") || todayKey();
  }

  function patchSavedReportTotalsV16() {
    document.querySelectorAll("#saved-attendance-detail-body tr").forEach((row) => {
      const cells = row.querySelectorAll("td");
      if (cells.length < 7) return;

      const segmentsText = cells[4].textContent;
      const totalCell = cells[5];

      if (clean(totalCell.textContent) === "0:00" && clean(segmentsText)) {
        const minutes = totalMinutesFromSegmentsText(segmentsText);
        if (minutes > 0) {
          totalCell.textContent = `${Math.floor(minutes / 60)}:${pad(minutes % 60)}`;
        }
      }
    });
  }

  function patchMonthlyTotalsV16() {
    // This only improves display if report already loaded with segment rows.
    patchSavedReportTotalsV16();
  }

  function rememberUploadDateV16() {
    const date = selectedUploadDateV16();
    localStorage.setItem("staffsync.lastAttendanceUploadDate", date);

    const dailyDate =
      document.querySelector("#saved-attendance-date") ||
      document.querySelector("#staff-daily-attendance-date") ||
      document.querySelector("#attendance-date");

    if (dailyDate && dailyDate.value !== date) {
      dailyDate.value = date;
      dailyDate.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  // Force every save to use the manual upload date, not the Excel sheet date.
  const originalFetch = window.fetch;
  window.fetch = async function (url, options) {
    try {
      const textUrl = String(url || "");
      const isAttendanceSave =
        textUrl.includes("/rest/v1/attendance_imports") &&
        options &&
        String(options.method || "").toUpperCase() === "POST" &&
        options.body;

      if (isAttendanceSave) {
        const uploadDate = selectedUploadDateV16();
        const rows = JSON.parse(options.body);

        if (Array.isArray(rows)) {
          rows.forEach((row) => {
            row.attendance_date = uploadDate;

            const calc = totalMinutesFromSegmentsJson(row.segments);
            if (calc > 0) row.total_minutes = calc;
          });

          options.body = JSON.stringify(rows);
          localStorage.setItem("staffsync.lastAttendanceUploadDate", uploadDate);
        }
      }
    } catch {}

    return originalFetch.apply(this, arguments);
  };

  document.addEventListener("change", function (event) {
    if (event.target?.id === "attendance-upload-date-v16") {
      rememberUploadDateV16();
    }
  });

  document.addEventListener("click", function (event) {
    const text = String(event.target?.closest("button")?.textContent || "").toLowerCase();

    if (text.includes("save attendance")) {
      rememberUploadDateV16();
      setTimeout(rememberUploadDateV16, 600);
      setTimeout(patchSavedReportTotalsV16, 1500);
      setTimeout(patchMonthlyTotalsV16, 2500);
    }

    if (text.includes("load saved") || text.includes("load report")) {
      setTimeout(patchSavedReportTotalsV16, 800);
      setTimeout(patchMonthlyTotalsV16, 1600);
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    ensureUploadDateInputV16();
    rememberUploadDateV16();
    setTimeout(patchSavedReportTotalsV16, 1200);
  });

  setTimeout(ensureUploadDateInputV16, 500);
  setTimeout(rememberUploadDateV16, 900);
})();
</script>
<!-- attendance-date-total-fix-v16-end -->
