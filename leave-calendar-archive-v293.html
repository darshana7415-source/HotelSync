<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leave Calendar Archive - StaffSync Beach & Bliss Mirissa</title>
  <script src="env.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f4fbfb; color:#10202a; }
    .shell { max-width:1180px; margin:0 auto; padding:16px; }
    .top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:14px; }
    h1 { margin:0; font-size:28px; }
    .muted { color:#667085; font-size:13px; }
    .back { display:inline-block; background:#006b6b; color:#fff; text-decoration:none; font-weight:800; padding:10px 12px; border-radius:8px; }
    .card { background:#fff; border:1px solid #d8e8e8; border-radius:10px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.05); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .tabs button { border:1px solid #d8e8e8; border-radius:8px; padding:10px 12px; background:#eef8f8; color:#006b6b; font-weight:800; cursor:pointer; }
    .tabs button.active { background:#006b6b; color:#fff; }
    .calendar { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; margin-top:10px; }
    .head { padding:8px; background:#eaf7f7; color:#006b6b; font-weight:900; border-radius:8px; text-align:center; }
    .day { min-height:88px; padding:8px; border:1px solid #d8e8e8; border-radius:8px; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.04); }
    .day.empty { background:#f7fbfb; box-shadow:none; }
    .day strong { display:block; margin-bottom:4px; font-size:18px; }
    .pill { display:block; margin:4px 0; padding:5px 6px; border-radius:6px; font-size:11px; line-height:1.2; font-weight:700; }
    .approved { background:#dff7e8; color:#116b35; }
    .rejected { background:#ffe1e1; color:#9a1b1b; }
    .cancelled { background:#eceff3; color:#52606d; }
    .pending { background:#fff4d6; color:#8a5b00; }
    .message { padding:14px; border:1px solid #d8e8e8; border-radius:8px; background:#fff; color:#667085; }
    @media(max-width:720px) {
      .shell { padding:10px; }
      h1 { font-size:20px; }
      .calendar { gap:4px; }
      .head { font-size:9px; padding:5px 2px; }
      .day { min-height:48px; padding:3px; }
      .day strong { font-size:11px; }
      .pill { font-size:7.5px; padding:2px; }
      .back { padding:8px 10px; font-size:12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <h1>Leave Calendar Archive</h1>
        <div class="muted">StaffSync Beach & Bliss Mirissa</div>
      </div>
      <a class="back" href="index.html#leave">Back to Leave</a>
    </div>

    <section class="card">
      <strong>Leave calendar month</strong>
      <div class="muted">Saved previous months, current month, and coming month.</div>
      <div class="tabs" id="month-tabs"></div>
      <div id="status" class="message">Loading leave calendar...</div>
      <div class="calendar" id="calendar"></div>
    </section>
  </main>

<script>
var rows = [];
var selectedMonth = new Date().toISOString().slice(0, 7);

function getConfigValue(name) {
  if (window.STAFFSYNC_ENV && window.STAFFSYNC_ENV[name]) return window.STAFFSYNC_ENV[name];
  if (window.STAFFSYNC_CONFIG && window.STAFFSYNC_CONFIG[name]) return window.STAFFSYNC_CONFIG[name];
  if (window[name]) return window[name];
  return "";
}

function addMonths(key, count) {
  var d = new Date(key + "-01T00:00:00");
  d.setMonth(d.getMonth() + count);
  return d.toISOString().slice(0, 7);
}

function monthLabel(key) {
  return new Date(key + "-01T00:00:00").toLocaleDateString("en-US", { month:"long", year:"numeric" });
}

function monthEnd(key) {
  var d = new Date(key + "-01T00:00:00");
  d.setMonth(d.getMonth() + 1);
  d.setDate(0);
  return d.toISOString().slice(0, 10);
}

function monthsToShow() {
  var current = new Date().toISOString().slice(0, 7);
  var last = addMonths(current, 1);
  var months = [];
  var cursor = "2026-07";

  while (cursor <= last) {
    months.push(cursor);
    cursor = addMonths(cursor, 1);
  }

  return months;
}

function classFor(status) {
  var s = String(status || "").toLowerCase();
  if (s.indexOf("reject") >= 0) return "rejected";
  if (s.indexOf("cancel") >= 0) return "cancelled";
  if (s.indexOf("approve") >= 0 || s.indexOf("grant") >= 0) return "approved";
  return "pending";
}

function covers(row, date) {
  var start = String(row.start_date || "").slice(0, 10);
  var end = String(row.end_date || start).slice(0, 10);
  return start <= date && end >= date;
}

function render() {
  var months = monthsToShow();
  if (months.indexOf(selectedMonth) < 0) selectedMonth = new Date().toISOString().slice(0, 7);

  var tabHtml = "";
  for (var i = 0; i < months.length; i++) {
    var month = months[i];
    tabHtml += '<button type="button" class="' + (month === selectedMonth ? "active" : "") + '" data-month="' + month + '">' + monthLabel(month) + '</button>';
  }
  document.getElementById("month-tabs").innerHTML = tabHtml;

  var first = new Date(selectedMonth + "-01T00:00:00");
  var blanks = first.getDay();
  var days = Number(monthEnd(selectedMonth).slice(8, 10));
  var cells = "";

  var week = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for (var h = 0; h < week.length; h++) cells += '<div class="head">' + week[h] + '</div>';

  for (var b = 0; b < blanks; b++) cells += '<div class="day empty"></div>';

  for (var day = 1; day <= days; day++) {
    var date = selectedMonth + "-" + String(day).padStart(2, "0");
    var inside = "";

    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      if (!covers(row, date)) continue;
      inside += '<span class="pill ' + classFor(row.status) + '">' +
        (row.employee_code || "") + " " +
        (row.full_name || "") + " - " +
        (row.leave_type || "Leave") + " - " +
        (row.status || "") +
      '</span>';
    }

    cells += '<div class="day"><strong>' + day + '</strong>' + inside + '</div>';
  }

  document.getElementById("calendar").innerHTML = cells;
  document.getElementById("status").textContent = "Loaded " + rows.length + " leave records.";
}

document.addEventListener("click", function(event) {
  var button = event.target.closest("[data-month]");
  if (!button) return;
  selectedMonth = button.getAttribute("data-month");
  render();
});

function loadCalendar() {
  var url = getConfigValue("SUPABASE_URL");
  var key = getConfigValue("SUPABASE_ANON_KEY");

  if (!url || !key) {
    document.getElementById("status").textContent = "Supabase settings not found in env.js.";
    return;
  }

  var endpoint = url.replace(/\/$/, "") + "/rest/v1/staffsync_leave_calendar_archive_view?select=*&order=start_date.asc&order=employee_code.asc";

  fetch(endpoint, {
    method: "GET",
    headers: {
      "apikey": key,
      "Authorization": "Bearer " + key,
      "Accept": "application/json"
    }
  })
  .then(function(response) {
    return response.text().then(function(text) {
      if (!response.ok) throw new Error(response.status + " " + text);
      return JSON.parse(text || "[]");
    });
  })
  .then(function(data) {
    rows = data || [];
    render();
  })
  .catch(function(error) {
    document.getElementById("status").textContent = "Could not load leave calendar: " + error.message;
  });
}

setTimeout(loadCalendar, 500);
</script>
</body>
</html>
