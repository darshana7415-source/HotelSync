<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StaffSync Shifts</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="env.js"></script>
  <style>
    body { background:#f6faf9; color:#102026; margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    .shift-page-shell { max-width:1100px; margin:0 auto; padding:18px; }
    .shift-top { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:16px; }
    .shift-top h1 { margin:0; font-size:24px; }
    .shift-top a { color:#075f63; font-weight:800; text-decoration:none; }
    .shift-card { background:white; border:1px solid #dbe8e5; border-radius:10px; padding:14px; box-shadow:0 8px 24px rgba(16,32,38,.06); }
    .shift-card h2 { margin:0 0 4px; font-size:18px; }
    .shift-card small { color:#667; }
    .shift-dept-fold { border:1px solid #dcebea; border-radius:9px; margin-top:12px; background:#fbfefd; overflow:hidden; }
    .shift-dept-fold summary { cursor:pointer; padding:12px 14px; font-weight:800; color:#075f63; }
    .shift-table { width:100%; border-collapse:collapse; table-layout:fixed; background:white; }
    .shift-table th, .shift-table td { border:1px solid #dcebea; padding:10px; vertical-align:top; }
    .shift-table th { color:#075f63; text-align:left; font-weight:900; background:white; }
    .staff-col { width:38%; }
    .day-col { width:20.66%; }
    .staff-name, .shift-name { display:block; font-weight:900; color:#102026; }
    .staff-role, .shift-time { display:block; color:#667; margin-top:3px; }
    .leave-cell .shift-name { color:#075f63; }
    .mini-empty { padding:16px; background:white; border:1px solid #dbe8e5; border-radius:8px; color:#667; }

    /* Mobile: keep text readable and let the table scroll sideways instead of
       shrinking everything to 8px. The staff-name column stays pinned while scrolling. */
    @media (max-width:720px) {
      .shift-page-shell {
        width:100%;
        max-width:100%;
        padding:10px;
        box-sizing:border-box;
      }
      .shift-top {
        gap:8px;
        margin-bottom:10px;
        flex-wrap:wrap;
      }
      .shift-top h1 {
        font-size:19px;
        line-height:1.2;
      }
      .shift-top a {
        min-height:44px;
        display:inline-flex;
        align-items:center;
      }
      .shift-card {
        padding:10px;
        box-sizing:border-box;
      }
      .shift-card h2 {
        font-size:16px;
      }
      .shift-dept-fold summary {
        padding:12px 10px;
        font-size:16px;
        min-height:44px;
        box-sizing:border-box;
      }
      .shift-dept-fold {
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
      }
      .shift-table {
        table-layout:auto;
        min-width:560px;
      }
      .shift-table th, .shift-table td {
        padding:8px 7px;
      }
      .staff-col {
        width:auto;
        min-width:130px;
      }
      .day-col {
        width:auto;
        min-width:120px;
      }
      .shift-table th:first-child,
      .shift-table td:first-child {
        position:sticky;
        left:0;
        background:white;
        z-index:1;
        box-shadow:2px 0 0 #dcebea;
      }
      .staff-name, .shift-name {
        font-size:13px;
        line-height:1.3;
      }
      .staff-role, .shift-time {
        font-size:12px;
        line-height:1.3;
      }
      .shift-table th {
        font-size:12px;
      }
    }
  </style>
</head>
<body>
  <main class="shift-page-shell">
    <div class="shift-top">
      <div>
        <h1>Coming 3 days shifts</h1>
        <small>StaffSync Beach & Bliss Mirissa</small>
      </div>
      <a href="index.html#dashboard">Back to dashboard</a>
    </div>

    <section class="shift-card">
      <h2>Department shift calendar</h2>
      <small>Open a department to see staff names and actual shift times.</small>
      <div id="shift-board" class="mini-empty">Loading shifts...</div>
    </section>
  </main>

<script>
(function () {
  const board = document.querySelector("#shift-board");
  const cfg = window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || {};
  const db = window.supabase?.createClient?.(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  if (!db) {
    board.textContent = "Supabase settings not loaded. Check env.js.";
    return;
  }

  function dateKey(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function labelDate(key) {
    return new Date(key + "T00:00:00").toLocaleDateString("en-US", { month:"short", day:"numeric" });
  }

  function code(p) { return String(p.employee_code || "").trim(); }
  function name(p) { return p.full_name || "Staff"; }
  function job(p) { return p.job_title || "Staff"; }
  function dept(p) { return p.department || "General"; }

  function sortPeople(list) {
    return [...list].sort((a, b) => code(a).localeCompare(code(b), undefined, { numeric:true }));
  }

  function entryFor(rosters, person, date) {
    return rosters.find((r) =>
      String(r.staff_id) === String(person.staff_id) &&
      String(r.roster_date).slice(0, 10) === date
    );
  }

  function leaveFor(leaves, person, date) {
    return leaves.find((l) => {
      const start = String(l.start_date || "").slice(0, 10);
      const end = String(l.end_date || l.start_date || "").slice(0, 10);
      return String(l.staff_id) === String(person.staff_id) && start && date >= start && date <= end;
    });
  }

  function shiftCell(rosters, leaves, person, date) {
    const leave = leaveFor(leaves, person, date);
    if (leave) {
      const leaveType = leave.leave_type || "Leave";
      return `<td class="leave-cell"><span class="shift-name">${leaveType}</span><span class="shift-time">${String(leaveType).toUpperCase()}</span></td>`;
    }

    const r = entryFor(rosters, person, date);
    const shift = r?.shift_name || person.default_shift_type || "10h shift";
    const start = String(r?.start_time || "").slice(0, 5);
    const end = String(r?.end_time || "").slice(0, 5);
    const time = start && end ? `${start} - ${end}` : "Time not set";

    return `<td><span class="shift-name">${shift}</span><span class="shift-time">${time}</span></td>`;
  }

  async function load() {
    const dates = [dateKey(0), dateKey(1), dateKey(2)];

    const peopleResult = await db.from("staff_shift_people_view").select("*").order("employee_code", { ascending:true });
    const rosterResult = await db.from("staff_shift_roster_view").select("*").gte("roster_date", dates[0]).lte("roster_date", dates[2]);
    const leaveResult = await db.from("staff_shift_leave_view").select("*").lte("start_date", dates[2]).gte("end_date", dates[0]);

    if (peopleResult.error) { board.textContent = peopleResult.error.message; return; }
    if (rosterResult.error) { board.textContent = rosterResult.error.message; return; }

    const people = sortPeople(peopleResult.data || []);
    const rosters = rosterResult.data || [];
    const leaves = leaveResult.error ? [] : (leaveResult.data || []);
    const groups = {};

    people.forEach((p) => {
      const d = dept(p);
      groups[d] = groups[d] || [];
      groups[d].push(p);
    });

    board.className = "";
    board.innerHTML = Object.keys(groups).sort().map((department) => `
      <details class="shift-dept-fold">
        <summary>${department}</summary>
        <table class="shift-table">
          <thead>
            <tr>
              <th class="staff-col">Staff</th>
              ${dates.map((d) => `<th class="day-col">${labelDate(d)}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${groups[department].map((p) => `
              <tr>
                <td>
                  <span class="staff-name">${code(p)} - ${name(p)}</span>
                  <span class="staff-role">${job(p)}</span>
                </td>
                ${dates.map((d) => shiftCell(rosters, leaves, p, d)).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      </details>
    `).join("") || `<div class="mini-empty">No staff found.</div>`;
  }

  load();
})();
</script>
</body>
</html>
