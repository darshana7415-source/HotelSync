<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leave Calendar Archive - StaffSync Beach & Bliss Mirissa</title>
  <script src="env.js"></script>
  <style>
    :root {
      --teal:#006b6b;
      --teal-dark:#005252;
      --line:#d8e8e8;
      --bg:#f4fbfb;
      --card:#ffffff;
      --text:#10202a;
      --muted:#667085;
      --green-bg:#dff7e8;
      --green:#116b35;
      --red-bg:#ffe1e1;
      --red:#9a1b1b;
      --grey-bg:#eceff3;
      --grey:#52606d;
      --yellow-bg:#fff4d6;
      --yellow:#8a5b00;
    }

    body {
      margin:0;
      font-family:Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .shell {
      max-width:1180px;
      margin:0 auto;
      padding:16px;
    }

    .top {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }

    h1 {
      margin:0;
      font-size:28px;
      line-height:1.1;
    }

    .muted {
      color:var(--muted);
      font-size:13px;
    }

    .back {
      border:0;
      border-radius:8px;
      padding:10px 12px;
      background:var(--teal);
      color:#fff;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
    }

    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      padding:14px;
      box-shadow:0 8px 24px rgba(0,0,0,.05);
    }

    .tabs {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:12px 0;
    }

    .tabs button {
      border:1px solid var(--line);
      border-radius:8px;
      padding:10px 12px;
      background:#eef8f8;
      color:var(--teal);
      font-weight:800;
      cursor:pointer;
    }

    .tabs button.active {
      background:var(--teal);
      color:#fff;
    }

    .calendar {
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:8px;
      margin-top:10px;
    }

    .head {
      padding:8px;
      background:#eaf7f7;
      color:var(--teal);
      font-weight:900;
      border-radius:8px;
      text-align:center;
    }

    .day {
      min-height:88px;
      padding:8px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.04);
    }

    .day.empty {
      background:#f7fbfb;
      box-shadow:none;
    }

    .day strong {
      display:block;
      margin-bottom:4px;
      font-size:18px;
    }

    .pill {
      display:block;
      margin:4px 0;
      padding:5px 6px;
      border-radius:6px;
      font-size:11px;
      line-height:1.2;
      font-weight:700;
    }

    .approved { background:var(--green-bg); color:var(--green); }
    .rejected { background:var(--red-bg); color:var(--red); }
    .cancelled { background:var(--grey-bg); color:var(--grey); }
    .pending { background:var(--yellow-bg); color:var(--yellow); }

    .message {
      padding:14px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      color:var(--muted);
    }

    @media(max-width:720px) {
      .shell { padding:10px; }
      h1 { font-size:20px; }
      .calendar { gap:4px; }
      .head { font-size:9px; padding:5px 2px; }
      .day { min-height:48px; padding:3px; }
      .day strong { font-size:11px; }
      .pill { font-size:7.5px; padding:2px; }
      .back { padding:8px 10px; font-size:12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <h1>Leave Calendar Archive</h1>
        <div class="muted">StaffSync Beach & Bliss Mirissa</div>
      </div>
      <button class="back" type="button" onclick="location.href='index.html#leave'">Back to Leave</button>
    </div>

    <section class="card">
      <strong>Leave calendar month</strong>
      <div class="muted">Saved previous months, current month, and coming month.</div>
      <div class="tabs" id="month-tabs"></div>
      <div id="status" class="message">Loading leave calendar...</div>
      <div class="calendar" id="calendar" hidden></div>
    </section>
  </main>

<script>
let rows = [];
let selectedMonth = new Date().toISOString().slice(0, 7);

function cfgValue(...keys) {
  const sources = [
    window.STAFFSYNC_ENV,
    window.STAFFSYNC_CONFIG,
    window.staffsyncConfig,
    window.SUPABASE_CONFIG,
    window
  ].filter(Boolean);

  for (const source of sources) {
    for (const key of keys) {
      if (source[key]) return source[key];
    }
  }

  return "";
}

function addMonths(key, count) {
  const d = new Date(key + "-01T00:00:00");
  d.setMonth(d.getMonth() + count);
  return d.toISOString().slice(0, 7);
}

function monthLabel(key) {
  return new Date(key + "-01T00:00:00").toLocaleDateString("en-US", {
    month:"long",
    year:"numeric"
  });
}

function monthEnd(key) {
  const d = new Date(key + "-01T00:00:00");
  d.setMonth(d.getMonth() + 1);
  d.setDate(0);
  return d.toISOString().slice(0, 10);
}

function monthsToShow() {
  const current = new Date().toISOString().slice(0, 7);
  const last = addMonths(current, 1);
  const months = [];
  let cursor = "2026-07";

  while (cursor <= last) {
    months.push(cursor);
    cursor = addMonths(cursor, 1);
  }

  return months;
}

function classFor(status) {
  const s = String(status || "").toLowerCase();
  if (s.includes("reject")) return "rejected";
  if (s.includes("cancel")) return "cancelled";
  if (s.includes("approve") || s.includes("grant")) return "approved";
  return "pending";
}

function covers(row, date) {
  const start = String(row.start_date || "").slice(0, 10);
  const end = String(row.end_date || start).slice(0, 10);
  return start <= date && end >= date;
}

function render() {
  const months = monthsToShow();
  if (!months.includes(selectedMonth)) selectedMonth = new Date().toISOString().slice(0, 7);

  document.querySelector("#month-tabs").innerHTML = months.map(month =>
    `<button type="button" class="${month === selectedMonth ? "active" : ""}" data-month="${month}">${monthLabel(month)}</button>`
  ).join("");

  const first = new Date(selectedMonth + "-01T00:00:00");
  const blanks = first.getDay();
  const days = Number(monthEnd(selectedMonth).slice(8, 10));
  const cells = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(day => `<div class="head">${day}</div>`);

  for (let i = 0; i < blanks; i++) cells.push(`<div class="day empty"></div>`);

  for (let day = 1; day <= days; day++) {
    const date = selectedMonth + "-" + String(day).padStart(2, "0");
    const dayRows = rows.filter(row => covers(row, date));

    cells.push(`
      <div class="day">
        <strong>${day}</strong>
        ${dayRows.map(row => `
          <span class="pill ${classFor(row.status)}">
            ${row.employee_code || ""} ${row.full_name || ""} - ${row.leave_type || "Leave"} - ${row.status || ""}
          </span>
        `).join("")}
      </div>
    `);
  }

  document.querySelector("#calendar").innerHTML = cells.join("");
  document.querySelector("#calendar").hidden = false;
  document.querySelector("#status").hidden = true;
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-month]");
  if (!button) return;
  selectedMonth = button.dataset.month;
  render();
});

async function init() {
  const url = cfgValue("SUPABASE_URL", "supabaseUrl", "url");
  const key = cfgValue("SUPABASE_ANON_KEY", "supabaseAnonKey", "anonKey");

  if (!url || !key) {
    document.querySelector("#status").textContent = "Supabase settings not found in env.js.";
    return;
  }

  const endpoint = `${url.replace(/\/$/, "")}/rest/v1/staffsync_leave_calendar_archive_view?select=*&order=start_date.asc&order=employee_code.asc`;

  try {
    const response = await fetch(endpoint, {
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        Accept: "application/json"
      }
    });

    const text = await response.text();

    if (!response.ok) {
      document.querySelector("#status").textContent = `Could not load leave calendar: ${response.status} ${text}`;
      return;
    }

    rows = JSON.parse(text || "[]");

    if (!rows.length) {
      document.querySelector("#status").textContent = "Connected, but no leave records returned from staffsync_leave_calendar_archive_view.";
      document.querySelector("#calendar").hidden = false;
      render();
      return;
    }

    render();
  } catch (error) {
    document.querySelector("#status").textContent = `Could not load leave calendar: ${error.message}`;
  }
}

setTimeout(init, 300);
</script>
</body>
</html>
