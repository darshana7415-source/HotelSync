  <script src="env.js">async function saveAttendance(){
  const status=document.querySelector("#save-status");
  const url=cfg("SUPABASE_URL");
  const key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key){
    status.textContent="Supabase settings not found.";
    return;
  }

  const ready=latestRecords.filter(r=>r.status==="OK" && r.matched && r.date);
  if(!ready.length){
    status.textContent="No ready records to save.";
    return;
  }

  status.textContent="Saving attendance...";
  try{
    const staffRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/staff_profiles?select=id,employee_code,full_name",{
      headers:{apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}
    });
    if(!staffRes.ok) throw new Error(await staffRes.text());
    const staffRows=await staffRes.json();

    const payload=ready.map(r=>{
      const person=staffRows.find(s=>norm(s.full_name)===norm(r.matched));
      if(!person) return null;
      const segs=String(r.segments||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
        const p=x.split("-");
        return {in:p[0]||"",out:p[1]||""};
      });
      return {
        hotel_id:"00000000-0000-0000-0000-000000000001",
        staff_profile_id:person.id,
        attendance_date:r.date,
        source_name:r.name,
        clock_in:r.clockIn || null,
        clock_out:r.clockOut || null,
        segments:segs,
        total_minutes:Number(r.minutes)||0,
        source:"hikvision_excel"
      };
    }).filter(Boolean);

    if(!payload.length){
      status.textContent="No records matched StaffSync staff IDs.";
      return;
    }

    const saveRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/attendance_imports?on_conflict=hotel_id,staff_profile_id,attendance_date,source",{
      method:"POST",
      headers:{
        apikey:key,
        Authorization:"Bearer "+key,
        "Content-Type":"application/json",
        Prefer:"resolution=merge-duplicates,return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!saveRes.ok) throw new Error(await saveRes.text());

    status.textContent="Saved "+payload.length+" attendance records to StaffSync.";
  }catch(error){
    status.textContent="Save failed: "+error.message;
  }
}
document.addEventListener("click",e=>{
  if(e.target && e.target.id==="save-attendance") saveAttendance();
});
</script>

      <thead>
        <tr>
          <th>Date</th>
          <th>Staff</th>
          <th>Clock in</th>
          <th>Clock out</th>
          <th>Segments</th>

          <th>Status</th>
        </tr>

<script>
const aliases = {
  "dulip": "Duleep De Silva",
  "duleep": "Duleep De Silva",
  "priyantha": "Proyantha SH",
  "proyantha": "Proyantha SH"
};

let knownStaff = [
  "DIleesha De SIlva","Thusitha Paranamana","Duleep De Silva","Proyantha SH","Ajith",
  "Dineth","Ayesha","Supun","Ruwan Kumarasiri","Gayan","Kavindu Lakshan","Ganindu Sathruwan",
  "Muditha Weerarathne","Pathum","Naveen","Sineth","Navod","Kaveesha","Maleesha","Shiromi",
  "Nuwan","Isuri","Nipuni","Sujith","Chathura","Thanuj"
];

function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function cleanName(v){return String(v||"").replace(/\s+/g," ").trim();}
function cfg(name){
  return (window.STAFFSYNC_ENV && window.STAFFSYNC_ENV[name]) ||
    (window.STAFFSYNC_CONFIG && window.STAFFSYNC_CONFIG[name]) ||
    window[name] || "";
}
async function loadLiveStaff(){
  const url=cfg("SUPABASE_URL");
  const key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key) return;
  try{
    const endpoint=url.replace(/\/$/,"")+"/rest/v1/staff_profiles?select=employee_code,full_name&order=employee_code.asc";
    const res=await fetch(endpoint,{headers:{apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}});
    if(!res.ok) return;
    const data=await res.json();
    const names=data.map(x=>x.full_name).filter(Boolean);
    if(names.length) knownStaff=names;
    document.querySelector("#status").textContent="Live StaffSync staff list loaded. Choose the daily attendance sheet.";
  }catch(e){}
}
loadLiveStaff();

function matchStaff(name){
  const n=cleanName(name);
  const alias=aliases[norm(n)] || aliases[String(n).toLowerCase()];
  if(alias) return alias;
  const exact=knownStaff.find(s=>norm(s)===norm(n));
  if(exact) return exact;
  const loose=knownStaff.find(s=>norm(s).includes(norm(n)) || norm(n).includes(norm(s)));
  return loose || "";
}
function badValue(v){
  const s=String(v||"").toLowerCase().trim();
  return !s || s==="off" || s==="starting date" || s==="unmarked" || s.includes("#value");
}
function excelDateToYmd(v){
  if(typeof v==="string"){
    const s=v.trim();
    const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){
      const y=m[3].length===2 ? "20"+m[3] : m[3];
      return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
    }
  }
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  if(v instanceof Date){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  }
  return "";
}
function timeText(v){
  if(badValue(v)) return "";
  if(v instanceof Date) return `${String(v.getHours()).padStart(2,"0")}:${String(v.getMinutes()).padStart(2,"0")}`;
  if(typeof v==="number"){
    const total=Math.round(v*24*60);
    const hh=Math.floor(total/60)%24;
    const mm=total%60;
    return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  }
  const s=String(v||"").trim().replace(/\s+/g,"");
  const m=s.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return "";
  return `${String(m[1]).padStart(2,"0")}:${m[2]}`;
}
function minutes(t){const p=t.split(":").map(Number);return p[0]*60+p[1];}
function duration(start,end){
  if(!start||!end)return 0;
  let a=minutes(start), b=minutes(end);
  if(b<a)b+=1440;
  return b-a;
}
function hours(mins){
  const h=Math.floor(mins/60);
  const m=mins%60;
  return `${h}:${String(m).padStart(2,"0")}`;
}
function decimalHours(text){
  if(!text || !String(text).includes(":")) return 0;
  const p=String(text).split(":").map(Number);
  return p[0] + (p[1]/60);
}
function findHeader(rows){
  for(let r=0;r<Math.min(rows.length,10);r++){
    for(let c=0;c<rows[r].length;c++){
      const text=String(rows[r][c]||"").toLowerCase().replace(/\*/g,"").trim();
      const next=String(rows[r][c+1]||"").toLowerCase().replace(/\*/g,"").trim();
      if(text==="in" && next==="out"){
        return {row:r, firstIn:c, nameCol:Math.max(0,c-1)};
      }
    }
  }
  return {row:0, firstIn:2, nameCol:1};
}
function findDate(rows, header){
  const searchRows=rows.slice(0, Math.min(rows.length, header.row+2));
  for(const row of searchRows){
    for(const cell of row){
      const d=excelDateToYmd(cell);
      if(d) return d;
    }
  }
  return "";
}
function parseSheet(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  const header=findHeader(rows);
  const manualDate=document.querySelector("#attendance-date")?.value || "";
  const date=manualDate || findDate(rows, header);
  const out=[];

  for(let idx=header.row+1; idx<rows.length; idx++){
    const row=rows[idx];
    const name=cleanName(row[header.nameCol]);
    if(!name) continue;

    const lowered=name.toLowerCase();
    if(["in","out","shift1","shift2","shift3","total","left early","ot"].includes(lowered)) continue;
    if(lowered.includes("date") || lowered.includes("total")) continue;

    const rawFirst=String(row[header.firstIn]||"").toLowerCase().trim();
    if(rawFirst==="off"){
      out.push({date,name,matched:matchStaff(name),clockIn:"",clockOut:"",segments:"",hours:0,status:"OFF"});
      continue;
    }

    const pairs=[
      [row[header.firstIn],row[header.firstIn+1]],
      [row[header.firstIn+2],row[header.firstIn+3]],
      [row[header.firstIn+4],row[header.firstIn+5]]
    ].map(p=>[timeText(p[0]),timeText(p[1])]).filter(p=>p[0]||p[1]);

    const valid=pairs.filter(p=>p[0]&&p[1]);
    if(!pairs.length && !valid.length) continue;

    const total=valid.reduce((sum,p)=>sum+duration(p[0],p[1]),0);
    const matched=matchStaff(name);

    let status="OK";
    if(!matched) status="UNMATCHED";
    else if(!valid.length) status="NO VALID PUNCH";
    else if(valid.length!==pairs.length) status="MISSING IN/OUT";

    out.push({
      date,
      name,
      matched,
      clockIn: valid[0]?.[0] || "",
      clockOut: valid[valid.length-1]?.[1] || "",
      segments: valid.map(p=>p[0]+"-"+p[1]).join(", "),
      hours: hours(total),
      minutes: total,
      status
    });
  }
  return out;
}
function applyPreviewMonthlyHours(records){
  const totals = {};
  records.forEach(r=>{
    const staff = r.matched || r.name || "";
    const month = String(r.date || "").slice(0,7);
    if(!staff || !month || r.status !== "OK") return;
    const key = staff + "|" + month;
    totals[key] = (totals[key] || 0) + (Number(r.minutes) || 0);
  });
  records.forEach(r=>{
    const staff = r.matched || r.name || "";
    const month = String(r.date || "").slice(0,7);
    const key = staff + "|" + month;
    r.monthlyHours = hours(totals[key] || 0);
  });
}
let latestRecords = [];
function render(records){
  latestRecords = records;
  const saveButton = document.querySelector("#save-attendance");
  if(saveButton) saveButton.disabled = !records.some(r=>r.status==="OK" && r.matched);

  const body=document.querySelector("#body");
  body.innerHTML=records.map(r=>`
    <tr>
      <td>${r.date}</td>
      <td>${r.matched || r.name || "-"}</td>
      <td>${r.clockIn}</td>
      <td>${r.clockOut}</td>
      <td>${r.segments}</td>
      <td>${r.hours}</td>
      <td>${r.monthlyHours || r.hours}</td>
      <td class="${r.status==="OK"?"ok":(r.status==="UNMATCHED"||r.status==="NO VALID PUNCH"?"bad":"warn")}">${r.status}</td>
    </tr>
  `).join("");
  document.querySelector("#table").hidden=false;

  const ok=records.filter(r=>r.status==="OK").length;
  const unmatched=records.filter(r=>r.status==="UNMATCHED").length;
  const warnings=records.filter(r=>r.status!=="OK"&&r.status!=="UNMATCHED").length;
  const totalMinutes=records.reduce((s,r)=>s+(Number(r.minutes)||0),0);
  const totalHours=hours(totalMinutes);
  document.querySelector("#summary").innerHTML=`
    <div><b>${records.length}</b><br>Total rows</div>
    <div><b>${ok}</b><br>Ready records</div>
    <div><b>${unmatched}</b><br>Unmatched names</div>
    <div><b>${totalHours}</b><br>Total hours</div>
  `;
  document.querySelector("#status").textContent=`Preview loaded. ${warnings} warning rows found.`;
}
document.querySelector("#file").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:"array",cellDates:true});
  let all=[];
  wb.SheetNames.forEach(name=>{all=all.concat(parseSheet(wb.Sheets[name]));});
  const manualDate=document.querySelector("#attendance-date")?.value || "";
  if(manualDate){
    all=all.map(row=>({...row,date:manualDate}));
  }
  applyPreviewMonthlyHours(all);
  render(all);
});
async function saveAttendance(){
  const status=document.querySelector("#save-status");
  const url=cfg("SUPABASE_URL");
  const key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key){
    status.textContent="Supabase settings not found.";
    return;
  }

  const ready=latestRecords.filter(r=>r.status==="OK" && r.matched && r.date);
  if(!ready.length){
    status.textContent="No ready records to save.";
    return;
  }

  status.textContent="Saving attendance...";
  try{
    const staffRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/staff_profiles?select=id,employee_code,full_name",{
      headers:{apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}
    });
    if(!staffRes.ok) throw new Error(await staffRes.text());
    const staffRows=await staffRes.json();

    const payload=ready.map(r=>{
      const person=staffRows.find(s=>norm(s.full_name)===norm(r.matched));
      if(!person) return null;
      const segs=String(r.segments||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
        const p=x.split("-");
        return {in:p[0]||"",out:p[1]||""};
      });
      return {
        hotel_id:"00000000-0000-0000-0000-000000000001",
        staff_profile_id:person.id,
        attendance_date:r.date,
        source_name:r.name,
        clock_in:r.clockIn || null,
        clock_out:r.clockOut || null,
        segments:segs,
        total_minutes:Number(r.minutes)||0,
        source:"hikvision_excel"
      };
    }).filter(Boolean);

    if(!payload.length){
      status.textContent="No records matched StaffSync staff IDs.";
      return;
    }

    const saveRes=await fetch(url.replace(/\/$/,"")+"/rest/v1/attendance_imports?on_conflict=hotel_id,staff_profile_id,attendance_date,source",{
      method:"POST",
      headers:{
        apikey:key,
        Authorization:"Bearer "+key,
        "Content-Type":"application/json",
        Prefer:"resolution=merge-duplicates,return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!saveRes.ok) throw new Error(await saveRes.text());

    status.textContent="Saved "+payload.length+" attendance records to StaffSync.";
  }catch(error){
    status.textContent="Save failed: "+error.message;
  }
}
document.addEventListener("click",e=>{
  if(e.target && e.target.id==="save-attendance") saveAttendance();
});
</script>

<script>
(function () {
  const marker = "attendance-saved-report-v1";

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function todayMonth() {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  }

  function monthBounds(monthKey) {
    const parts = monthKey.split("-").map(Number);
    const start = new Date(parts[0], parts[1] - 1, 1);
    const end = new Date(parts[0], parts[1], 0);
    return {
      start: `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`,
      end: `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}`
    };
  }

  function env() {
    return window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || window.staffsyncConfig || window.SUPABASE_CONFIG || {};
  }

  function minutesText(minutes) {
    const value = Number(minutes || 0);
    const h = Math.floor(value / 60);
    const m = Math.round(value % 60);
    return `${h}:${pad(m)}`;
  }

  function timeText(value) {
    if (!value) return "";
    return String(value).slice(0, 5);
  }

  function sortCode(a, b) {
    const ac = Number(String(a.employee_code || "").replace(/\D/g, ""));
    const bc = Number(String(b.employee_code || "").replace(/\D/g, ""));
    if (Number.isFinite(ac) && Number.isFinite(bc) && ac !== bc) return ac - bc;
    return String(a.employee_code || "").localeCompare(String(b.employee_code || ""));
  }

  async function rest(path) {
    const cfg = env();
    const url = cfg.SUPABASE_URL || cfg.supabaseUrl || cfg.url || window.SUPABASE_URL;

  async function loadReport() {

    ]);

    const staffById = new Map(staffRows.map((person) => [person.id, person]));
    const grouped = new Map();

    attendanceRows.forEach((row) => {

        });

      const item = grouped.get(key);
      item.days += 1;

  }

  function addReportUi() {

<script>
(function () {
  function cleanCode(value) {
    return String(value || "").trim();
  }

  function isRemovedCode(value) {
    return cleanCode(value).toLowerCase().includes("removed");
  }

  function codeNumber(value) {
    const n = Number(cleanCode(value).replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  function sortTableByCode(tableBodySelector, codeColumnIndex, dateColumnIndex) {
    const body = document.querySelector(tableBodySelector);
    if (!body) return;

    const rows = Array.from(body.querySelectorAll("tr"));
    if (!rows.length) return;

    const filtered = rows.filter((row) => {
      const cells = row.querySelectorAll("td");
      const code = cells[codeColumnIndex]?.textContent || "";
      return !isRemovedCode(code);
    });

    filtered.sort((a, b) => {
      const acells = a.querySelectorAll("td");
      const bcells = b.querySelectorAll("td");
      const acode = codeNumber(acells[codeColumnIndex]?.textContent || "");
      const bcode = codeNumber(bcells[codeColumnIndex]?.textContent || "");
      if (acode !== bcode) return acode - bcode;

      if (dateColumnIndex !== null && dateColumnIndex !== undefined) {
        const adate = acells[dateColumnIndex]?.textContent || "";
        const bdate = bcells[dateColumnIndex]?.textContent || "";
        return adate.localeCompare(bdate);
      }

      return 0;
    });

    body.innerHTML = "";
    filtered.forEach((row) => body.appendChild(row));
  }

  function cleanAttendanceTables() {
    sortTableByCode("#saved-attendance-summary-body", 0, null);
    sortTableByCode("#saved-attendance-detail-body", 1, 0);

    document.querySelectorAll("table tbody tr").forEach((row) => {
      if (row.textContent.toLowerCase().includes("removed")) row.remove();
    });
  }

  const oldFetch = window.fetch;
  window.fetch = async function () {
    const response = await oldFetch.apply(this, arguments);

    try {
      const url = String(arguments[0] || "");
      if (url.includes("/rest/v1/staff_profiles")) {
        const clone = response.clone();
        const data = await clone.json();

        if (Array.isArray(data)) {
          const cleaned = data
            .filter((person) => !isRemovedCode(person.employee_code))
            .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));

          return new Response(JSON.stringify(cleaned), {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
        }
      }
    } catch (error) {
      // If this compatibility cleanup cannot read the response, keep the original response.
    }

    return response;
  };

  document.addEventListener("click", function (event) {
    if (event.target && event.target.closest("#load-saved-attendance")) {
      setTimeout(cleanAttendanceTables, 600);
      setTimeout(cleanAttendanceTables, 1500);
    }
  });

  setInterval(cleanAttendanceTables, 2000);
  setTimeout(cleanAttendanceTables, 1000);
})();
</script>

<script>
(function () {
  function cleanCode(value) {
    return String(value || "").trim();
  }

  function isRemovedCode(value) {
    return cleanCode(value).toLowerCase().includes("removed");
  }

  function codeNumber(value) {
    const n = Number(cleanCode(value).replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  function minutesText(minutes) {
    const value = Number(minutes || 0);
    const h = Math.floor(value / 60);
    const m = Math.round(value % 60);
    return `${h}:${String(m).padStart(2, "0")}`;
  }

  function normalizeName(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "");
  }

  function selectedAttendanceDate() {
    const dateInput =
      document.querySelector("#attendance-date") ||
      document.querySelector("#hikvision-date") ||
      document.querySelector("input[type='date']");
    return dateInput?.value || new Date().toISOString().slice(0, 10);
  }

  function getPreviewRows() {
    const rows = Array.from(document.querySelectorAll("table tbody tr"));
    return rows.map((row) => {
      const cells = Array.from(row.querySelectorAll("td")).map((cell) => cell.textContent.trim());
      const joined = cells.join(" ").toLowerCase();

      return {
        row,
        cells,
        date: cells[0] || selectedAttendanceDate(),
        sourceName: cells[1] || "",
        matchedName: cells[2] || "",
        clockIn: cells[3] || "",
        clockOut: cells[4] || "",
        segments: cells[5] || "",
        total: cells[6] || "",
        status: cells[7] || "",
        joined
      };
    });
  }

  async function fetchActiveStaffForAttendanceV3() {
    const cfg = window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || window.staffsyncConfig || window.SUPABASE_CONFIG || {};
    const url = cfg.SUPABASE_URL || cfg.supabaseUrl || cfg.url || window.SUPABASE_URL;
    const key = cfg.SUPABASE_ANON_KEY || cfg.supabaseAnonKey || cfg.anonKey || window.SUPABASE_ANON_KEY;
    if (!url || !key) return [];

    const res = await fetch(`${url}/rest/v1/staff_profiles?select=id,employee_code,full_name&order=employee_code.asc`, {
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        Accept: "application/json"
      }
    });

    if (!res.ok) return [];
    const staff = await res.json();
    return staff
      .filter((person) => !isRemovedCode(person.employee_code))
      .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));
  }

  function rowStatusForPerson(person, previewRows) {
    const code = cleanCode(person.employee_code);
    const nameKey = normalizeName(person.full_name);

    const match = previewRows.find((item) => {
      const sourceKey = normalizeName(item.sourceName);
      const matchedKey = normalizeName(item.matchedName);
      return matchedKey === nameKey || sourceKey === nameKey || item.cells.some((cell) => cleanCode(cell) === code);
    });

    if (!match) {
      return {
        date: selectedAttendanceDate(),
        code,
        name: person.full_name,
        clockIn: "",
        clockOut: "",
        segments: "",
        total: "0:00",
        status: "MISSING"
      };
    }

    if (match.joined.includes("off")) {
      return {
        date: match.date || selectedAttendanceDate(),
        code,
        name: person.full_name,
        clockIn: "",
        clockOut: "",
        segments: "",
        total: "0:00",
        status: "OFF"
      };
    }

    const hasBadWords =
      match.joined.includes("#value") ||
      match.joined.includes("unmarked") ||
      match.joined.includes("starting date") ||
      match.joined.includes("error");

    const hasAnyTime = Boolean(match.clockIn || match.clockOut || match.segments);
    const hasCompleteTime = Boolean(match.clockIn && match.clockOut && match.segments);

    if (hasBadWords || (hasAnyTime && !hasCompleteTime)) {
      return {
        date: match.date || selectedAttendanceDate(),
        code,
        name: person.full_name,
        clockIn: match.clockIn,
        clockOut: match.clockOut,
        segments: match.segments,
        total: "0:00",
        status: "ERROR TIME"
      };
    }

    return {
      date: match.date || selectedAttendanceDate(),
      code,
      name: person.full_name,
      clockIn: match.clockIn,
      clockOut: match.clockOut,
      segments: match.segments,
      total: match.total,
      status: match.status || "OK"
    };
  }

  async function rebuildPreviewWithEveryActiveStaffV3() {
    const staff = await fetchActiveStaffForAttendanceV3();
    if (!staff.length) return;

    const previewRows = getPreviewRows();
    const tableBodies = Array.from(document.querySelectorAll("table tbody"));
    const body = tableBodies.find((tbody) => {
      const text = tbody.closest("table")?.textContent || "";
      return text.includes("Matched staff") || text.includes("Clock in") || text.includes("Segments");
    });

    if (!body) return;

    const rows = staff.map((person) => rowStatusForPerson(person, previewRows))
      .sort((a, b) => codeNumber(a.code) - codeNumber(b.code));

    body.innerHTML = rows.map((item) => `
      <tr>
        <td>${item.date}</td>
        <td>${item.code}</td>
        <td>${item.name}</td>
        <td>${item.clockIn}</td>
        <td>${item.clockOut}</td>
        <td>${item.segments}</td>
        <td>${item.total}</td>
        <td><strong>${item.status}</strong></td>
      </tr>
    `).join("");
  }

  document.addEventListener("click", function (event) {
    const text = event.target?.textContent || "";
    if (
      text.includes("Preview") ||
      text.includes("Import") ||
      text.includes("Load") ||
      event.target?.closest("#load-saved-attendance")
    ) {
      setTimeout(rebuildPreviewWithEveryActiveStaffV3, 800);
      setTimeout(rebuildPreviewWithEveryActiveStaffV3, 1800);
    }
  });

  document.addEventListener("change", function (event) {
    if (event.target?.type === "file" || event.target?.type === "date") {
      setTimeout(rebuildPreviewWithEveryActiveStaffV3, 1000);
      setTimeout(rebuildPreviewWithEveryActiveStaffV3, 2200);
    }
  });
})();
</script>

<script>
(function () {
  function cleanCode(value) {
    return String(value || "").trim();
  }

  function isRemovedCode(value) {
    return cleanCode(value).toLowerCase().includes("removed");
  }

  function codeNumber(value) {
    const n = Number(cleanCode(value).replace(/\D/g, ""));
    return Number.isFinite(n) ? n : 999999;
  }

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function todayMonth() {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  }

  function monthBounds(monthKey) {
    const parts = String(monthKey || todayMonth()).split("-").map(Number);
    const start = new Date(parts[0], parts[1] - 1, 1);
    const end = new Date(parts[0], parts[1], 0);
    return {
      start: `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`,
      end: `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}`
    };
  }

  function minutesText(minutes) {
    const value = Number(minutes || 0);
    const h = Math.floor(value / 60);
    const m = Math.round(value % 60);
    return `${h}:${pad(m)}`;
  }

  function timeText(value) {
    if (!value) return "";
    return String(value).slice(0, 5);
  }

  function cfg() {
    return window.STAFFSYNC_ENV || window.STAFFSYNC_CONFIG || window.staffsyncConfig || window.SUPABASE_CONFIG || {};
  }

  async function restV4(path) {
    const env = cfg();
    const url = env.SUPABASE_URL || env.supabaseUrl || env.url || window.SUPABASE_URL;
    const key = env.SUPABASE_ANON_KEY || env.supabaseAnonKey || env.anonKey || window.SUPABASE_ANON_KEY;
    if (!url || !key) throw new Error("Supabase settings not found.");

    const res = await fetch(`${url}/rest/v1/${path}`, {
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        Accept: "application/json"
      }
    });

    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function parseSegments(value) {
    try {
      const parsed = Array.isArray(value) ? value : JSON.parse(value || "[]");
      return parsed.map((seg) => `${seg.in || ""}-${seg.out || ""}`).join(", ");
    } catch {
      return "";
    }
  }

  async function loadFullActiveAttendanceReportV4() {
    const monthInput = document.querySelector("#saved-attendance-month");
    const status = document.querySelector("#saved-attendance-status");
    const summaryBody = document.querySelector("#saved-attendance-summary-body");
    const detailBody = document.querySelector("#saved-attendance-detail-body");

    if (!summaryBody || !detailBody) return;

    const month = monthInput?.value || todayMonth();
    const bounds = monthBounds(month);

    if (status) status.textContent = "Loading all active staff attendance...";
    summaryBody.innerHTML = "";
    detailBody.innerHTML = "";

    const [staffRows, attendanceRows] = await Promise.all([
      restV4("staff_profiles?select=id,employee_code,full_name&order=employee_code.asc"),
      restV4(`attendance_imports?select=*&attendance_date=gte.${bounds.start}&attendance_date=lte.${bounds.end}&order=attendance_date.asc`)
    ]);

    const activeStaff = staffRows
      .filter((person) => !isRemovedCode(person.employee_code))
      .sort((a, b) => codeNumber(a.employee_code) - codeNumber(b.employee_code));

    const rowsByStaff = new Map();
    attendanceRows.forEach((row) => {
      if (!rowsByStaff.has(row.staff_profile_id)) rowsByStaff.set(row.staff_profile_id, []);
      rowsByStaff.get(row.staff_profile_id).push(row);
    });

    const summaryRows = activeStaff.map((person) => {
      const rows = rowsByStaff.get(person.id) || [];
      const minutes = rows.reduce((sum, row) => sum + Number(row.total_minutes || 0), 0);
      return {
        code: cleanCode(person.employee_code),
        name: person.full_name || "",
        days: rows.length,
        minutes
      };
    });

    summaryBody.innerHTML = summaryRows.map((row) => `
      <tr>
        <td>${row.code}</td>
        <td>${row.name}</td>
        <td>${row.days}</td>
        <td>${minutesText(row.minutes)}</td>
      </tr>
    `).join("");

    const detailRows = [];
    activeStaff.forEach((person) => {
      const rows = rowsByStaff.get(person.id) || [];

      if (!rows.length) {
        detailRows.push({
          date: month,
          code: cleanCode(person.employee_code),
          name: person.full_name || "",
          clockIn: "",
          clockOut: "",
          segments: "",
          total: "0:00",
          status: "MISSING"
        });
        return;
      }

      rows.forEach((row) => {
        const segments = parseSegments(row.segments);
        const badTime = !row.clock_in && !row.clock_out && Number(row.total_minutes || 0) > 0;
        detailRows.push({
          date: row.attendance_date,
          code: cleanCode(person.employee_code),
          name: person.full_name || row.source_name || "",
          clockIn: timeText(row.clock_in),
          clockOut: timeText(row.clock_out),
          segments,
          total: minutesText(row.total_minutes),
          status: badTime ? "ERROR TIME" : (Number(row.total_minutes || 0) === 0 ? "OFF" : "OK")
        });
      });
    });

    detailRows.sort((a, b) => {
      const codeDiff = codeNumber(a.code) - codeNumber(b.code);
      if (codeDiff !== 0) return codeDiff;
      return String(a.date).localeCompare(String(b.date));
    });

    detailBody.innerHTML = detailRows.map((row) => `
      <tr>
        <td>${row.date}</td>
        <td>${row.code}</td>
        <td>${row.name}</td>
        <td>${row.clockIn}</td>
        <td>${row.clockOut}</td>
        <td>${row.segments}</td>
        <td>${row.total}</td>
        <td><strong>${row.status}</strong></td>
      </tr>
    `).join("");

    if (status) {
      status.textContent = `Loaded ${attendanceRows.length} saved row${attendanceRows.length === 1 ? "" : "s"} and ${activeStaff.length} active staff for ${month}.`;
    }
  }

  document.addEventListener("click", function (event) {
    if (event.target?.closest("#load-saved-attendance")) {
      event.preventDefault();
      event.stopImmediatePropagation();
      loadFullActiveAttendanceReportV4().catch((error) => {
        const status = document.querySelector("#saved-attendance-status");
        if (status) status.textContent = `Could not load report: ${error.message}`;
      });
    }
  }, true);

  window.loadFullActiveAttendanceReportV4 = loadFullActiveAttendanceReportV4;

  setTimeout(function () {
    if (document.querySelector("#saved-attendance-summary-body")) {
      loadFullActiveAttendanceReportV4().catch(function () {});
    }
  }, 1200);
})();
</script>

<script>
(function () {
  function norm(value) {
    return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function staffCodeFromNameV5(value) {
    const key = norm(value);

    if (
      key === "priyantha" ||
      key.includes("priyantha") ||
      key.includes("proyantha")
    ) {
      return "04";
    }

    return "";
  }

  function statusClassV5(status) {
    const text = String(status || "").toUpperCase();

    if (text.includes("ERROR")) return "attendance-status-error";
    if (text.includes("OFF")) return "attendance-status-off";
    if (text.includes("NO FINGERPRINT") || text.includes("MISSING")) return "attendance-status-missing";
    if (text.includes("OK")) return "attendance-status-ok";

    return "";
  }

  function cleanStatusTextV5(status) {
    const text = String(status || "").trim().toUpperCase();
    if (text === "MISSING") return "NO FINGERPRINT";
    return status || "";
  }

  function recolorAttendanceStatusesV5() {
    document.querySelectorAll("table tbody tr").forEach((row) => {
      const cells = row.querySelectorAll("td");
      if (!cells.length) return;

      const last = cells[cells.length - 1];
      const status = cleanStatusTextV5(last.textContent);
      const className = statusClassV5(status);

      if (className) {
        last.innerHTML = `<strong class="${className}">${status}</strong>`;
      }
    });
  }

  function fixPriyanthaVisibleRowsV5() {
    document.querySelectorAll("table tbody tr").forEach((row) => {
      const cells = row.querySelectorAll("td");
      if (cells.length < 3) return;

      const rowText = row.textContent || "";
      const mappedCode = staffCodeFromNameV5(rowText);
      if (mappedCode !== "04") return;

      // Preview table format normally has Date, Code/Sheet Name, Name...
      // Force the visible code/name to the active StaffSync profile.
      if (cells.length >= 8) {
        cells[1].textContent = "04";
        cells[2].textContent = "Priyantha";
      }
    });
  }

  function applyAttendanceDisplayFixesV5() {
    fixPriyanthaVisibleRowsV5();
    recolorAttendanceStatusesV5();
  }

  document.addEventListener("click", function () {
    setTimeout(applyAttendanceDisplayFixesV5, 300);
    setTimeout(applyAttendanceDisplayFixesV5, 1200);
    setTimeout(applyAttendanceDisplayFixesV5, 2500);
  });

  document.addEventListener("change", function () {
    setTimeout(applyAttendanceDisplayFixesV5, 500);
    setTimeout(applyAttendanceDisplayFixesV5, 1800);
  });

  setInterval(applyAttendanceDisplayFixesV5, 2000);
})();
</script>
<!-- attendance-alias-status-colors-v5-end -->
